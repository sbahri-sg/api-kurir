openapi: 3.1.0
info:
  title: API Kurir Partner Integration Contract
  version: 1.0.0-draft
  description: >
    Contract-first southbound API untuk ekspedisi, aggregator, dan penyedia
    last-mile yang terhubung ke Emisell melalui API Kurir. Paths adalah
    endpoint yang wajib disediakan partner. Bagian webhooks adalah event yang
    dikirim partner ke callback API Kurir. Dokumen ini belum menyatakan bahwa
    endpoint telah aktif di production.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
x-contract-status: draft
x-owner: API Kurir / Emisell
servers:
  - url: https://{partnerHost}/partner/v1
    description: Partner Connector API
    variables:
      partnerHost:
        default: api.partner.example
        description: Host HTTPS aktif connector milik partner
security:
  - partnerBearerAuth: []
    partnerKeyId: []
tags:
  - name: Health
    description: Kesiapan teknis connector tanpa membuat transaksi
  - name: Capabilities
    description: Capability dan katalog layanan yang telah disertifikasi
  - name: Rates
    description: Coverage serta quote tarif yang mengikat payload shipment
  - name: Shipments
    description: Booking, rekonsiliasi, pembatalan, dan label shipment
  - name: Pickups
    description: Penjadwalan pengambilan satu atau beberapa shipment
  - name: Tracking
    description: Tracking AWB eksternal jika capability partner tersedia
  - name: Finance
    description: Saldo dan payment inquiry opsional milik account partner
  - name: Events
    description: Webhook perubahan AWB dan status dari partner ke API Kurir
paths:
  /health:
    get:
      tags: [Health]
      operationId: partnerHealth
      summary: Memeriksa kesiapan connector
      parameters:
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Connector siap
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"

  /capabilities:
    get:
      tags: [Capabilities]
      operationId: getPartnerCapabilities
      summary: Membaca capability partner
      parameters:
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Capability connector
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /services:
    get:
      tags: [Capabilities]
      operationId: listPartnerServices
      summary: Membaca daftar layanan partner
      parameters:
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Daftar layanan aktif
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /rates:
    post:
      tags: [Rates]
      operationId: getPartnerRates
      summary: Mengambil quote tarif partner
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatesRequest"
      responses:
        "200":
          description: Quote tersedia
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"

  /shipments:
    post:
      tags: [Shipments]
      operationId: createPartnerShipment
      summary: Membuat booking shipment
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentCreateRequest"
      responses:
        "201":
          description: Shipment dibuat atau menunggu booking carrier
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"

  /shipments/{partner_shipment_id}:
    get:
      tags: [Shipments]
      operationId: getPartnerShipment
      summary: Rekonsiliasi detail shipment
      parameters:
        - $ref: "#/components/parameters/PartnerShipmentID"
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Detail shipment
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /shipments/{partner_shipment_id}/cancel:
    post:
      tags: [Shipments]
      operationId: cancelPartnerShipment
      summary: Meminta pembatalan shipment
      parameters:
        - $ref: "#/components/parameters/PartnerShipmentID"
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "202":
          description: Pembatalan diterima dan dapat masih menunggu carrier
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /shipments/{partner_shipment_id}/label:
    get:
      tags: [Shipments]
      operationId: getPartnerShipmentLabel
      summary: Mengambil label shipment
      parameters:
        - $ref: "#/components/parameters/PartnerShipmentID"
        - $ref: "#/components/parameters/XRequestID"
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [pdf, json]
            default: pdf
      responses:
        "200":
          description: PDF atau URL label sementara
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/LabelResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /pickups:
    post:
      tags: [Pickups]
      operationId: createPartnerPickup
      summary: Meminta pickup satu atau beberapa shipment
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupRequest"
      responses:
        "201":
          description: Pickup dibuat
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /pickup-windows/search:
    post:
      tags: [Pickups]
      operationId: searchPartnerPickupWindows
      summary: Mencari jadwal pickup regular yang tersedia
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickupWindowSearchRequest"
      responses:
        "200":
          description: Window pickup provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupWindowSearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /labels/batch:
    post:
      tags: [Shipments]
      operationId: createPartnerBatchLabel
      summary: Membuat label untuk beberapa shipment
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchLabelRequest"
      responses:
        "200":
          description: Label batch selesai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelResponse"
        "202":
          description: Label batch sedang diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchLabelPendingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /tracking/waybills:
    post:
      tags: [Tracking]
      operationId: trackExternalWaybill
      summary: Melacak AWB yang tidak harus dibuat melalui partner
      parameters:
        - $ref: "#/components/parameters/XRequestID"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalTrackingRequest"
      responses:
        "200":
          description: Snapshot tracking AWB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalTrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"

  /account/balance:
    get:
      tags: [Finance]
      operationId: getPartnerAccountBalance
      summary: Membaca saldo partner jika capability tersedia
      parameters:
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Snapshot saldo partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"

  /payments/{payment_id}:
    get:
      tags: [Finance]
      operationId: getPartnerPayment
      summary: Rekonsiliasi payment provider
      parameters:
        - $ref: "#/components/parameters/PaymentID"
        - $ref: "#/components/parameters/XRequestID"
      responses:
        "200":
          description: Detail payment partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentInquiryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

webhooks:
  shipmentEvent:
    post:
      tags: [Events]
      operationId: receivePartnerShipmentEvent
      summary: Partner mengirim perubahan AWB atau status ke API Kurir
      description: >
        Callback URL diberikan API Kurir saat onboarding. Partner wajib
        mempertahankan X-Event-Id yang sama pada setiap retry.
      security:
        - eventBearerAuth: []
          eventKeyId: []
      parameters:
        - $ref: "#/components/parameters/XEventID"
        - $ref: "#/components/parameters/XSignatureVersion"
        - $ref: "#/components/parameters/XSignatureTimestamp"
        - $ref: "#/components/parameters/XSignatureNonce"
        - $ref: "#/components/parameters/XSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentEvent"
      responses:
        "202":
          description: Event valid diterima atau duplikat identik
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcknowledgement"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/EventConflict"
        "413":
          description: Payload melebihi batas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    partnerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit
      description: Credential connector dengan scope minimum
    partnerKeyId:
      type: apiKey
      in: header
      name: X-Partner-Key-Id
      description: ID credential untuk rotasi tanpa mengirim nama akun
    eventBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit
      description: Token event terpisah dari credential connector
    eventKeyId:
      type: apiKey
      in: header
      name: X-Partner-Key-Id
      description: ID webhook secret aktif

  headers:
    XRequestID:
      description: Request ID dari API Kurir
      schema:
        type: string
        minLength: 8
        maxLength: 128

  parameters:
    XRequestID:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XEventID:
      name: X-Event-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    XSignatureVersion:
      name: X-Signature-Version
      in: header
      required: true
      schema:
        type: string
        const: v1
    XSignatureTimestamp:
      name: X-Signature-Timestamp
      in: header
      required: true
      description: Unix timestamp; toleransi maksimum 300 detik
      schema:
        type: string
        pattern: "^[0-9]{10}$"
    XSignatureNonce:
      name: X-Signature-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    XSignature:
      name: X-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 128
    PartnerShipmentID:
      name: partner_shipment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PaymentID:
      name: payment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    InvalidRequest:
      description: Payload atau parameter tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credential atau signature tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Credential tidak memiliki scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Shipment tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency conflict atau transisi status tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EventConflict:
      description: Event ID sama dengan payload berbeda
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Coverage, service, quote, atau state tidak dapat diproses
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Rate limit tercapai
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TemporarilyUnavailable:
      description: Partner atau carrier sementara tidak tersedia
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderTimeout:
      description: Status request upstream tidak diketahui; lakukan rekonsiliasi
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        time:
          type: string
          format: date-time

    CapabilitiesResponse:
      type: object
      required:
        - provider_code
        - provider_name
        - contract_version
        - capabilities
        - location_granularities
        - webhook_event_types
      properties:
        provider_code:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,31}$"
        provider_name:
          type: string
        contract_version:
          type: string
          const: "1.0"
        capabilities:
          $ref: "#/components/schemas/Capabilities"
        location_granularities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [province, city, district, subdistrict, postal_code, coordinate]
        webhook_event_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EventType"

    Capabilities:
      type: object
      required:
        - rates
        - shipment_create
        - shipment_cancel
        - scheduled_pickup
        - on_demand_pickup
        - dropoff
        - label
        - batch_label
        - tracking
        - external_tracking
        - webhook
        - cod
        - insurance
        - instant
        - multi_package
        - multi_destination
        - balance
        - payment_inquiry
      properties:
        rates:
          type: boolean
        shipment_create:
          type: boolean
        shipment_cancel:
          type: boolean
        scheduled_pickup:
          type: boolean
        on_demand_pickup:
          type: boolean
        dropoff:
          type: boolean
        label:
          type: boolean
        batch_label:
          type: boolean
        tracking:
          type: boolean
        external_tracking:
          type: boolean
        webhook:
          type: boolean
        cod:
          type: boolean
        insurance:
          type: boolean
        instant:
          type: boolean
        multi_package:
          type: boolean
        multi_destination:
          type: boolean
        balance:
          type: boolean
        payment_inquiry:
          type: boolean

    DeliveryMode:
      type: string
      enum:
        - regular
        - economy
        - cargo
        - same_day
        - next_day
        - instant
        - international

    ServicesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Service"

    Service:
      type: object
      required:
        - code
        - name
        - courier_code
        - courier_name
        - service_group
        - service_type
        - delivery_type
        - delivery_mode
        - active
        - supports_cod
        - supports_insurance
        - supports_pickup
        - supports_dropoff
        - supports_multi_destination
        - vehicle_types
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
        courier_code:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{1,31}$"
        courier_name:
          type: string
        service_group:
          type: string
          enum: [regular, economy, cargo, same_day, next_day, instant, international]
        service_type:
          type: string
          enum: [parcel, cargo, same_day, instant, international]
        delivery_type:
          type: string
          enum: [express, instant, cargo, international]
        delivery_mode:
          $ref: "#/components/schemas/DeliveryMode"
        active:
          type: boolean
        supports_cod:
          type: boolean
        supports_insurance:
          type: boolean
        supports_pickup:
          type: boolean
        supports_dropoff:
          type: boolean
        supports_multi_destination:
          type: boolean
        vehicle_types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [motor, car, van, truck]
        cut_off_time:
