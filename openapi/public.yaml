openapi: 3.1.0
info:
  title: API Kurir
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    API ongkir internal Emisell. Endpoint customer pada /api/v1 kompatibel
    dengan kontrak shipping-cost RajaOngkir V2 dan memakai ID numerik dump
    region-service RajaOngkir; /v1 memakai kontrak canonical untuk client
    internal. Header key dan Bearer hanya cara autentikasi dan tidak mengubah
    bentuk respons. Uang menggunakan integer rupiah dan berat menggunakan gram.
servers:
  - url: /
    description: Host API Kurir aktif
security:
  - bearerAuth: []
  - rajaOngkirKeyAuth: []
tags:
  - name: Health
    description: Liveness dan readiness service
  - name: RajaOngkir V2 - Locations
    description: Master lokasi dengan ID numerik dan envelope RajaOngkir V2
  - name: RajaOngkir V2 - Couriers
    description: Kurir serta layanan pada façade RajaOngkir V2
  - name: RajaOngkir V2 - Rates
    description: Kalkulasi ongkir form-urlencoded pada façade RajaOngkir V2
  - name: RajaOngkir V2 - Tracking
    description: Tracking AWB sinkron dengan envelope RajaOngkir V2
  - name: Emisell Legacy
    description: Façade kompatibilitas region-service dan shipping lama
  - name: Canonical - Locations
    description: Master lokasi internal dengan public ID loc_idn_*
  - name: Canonical - Couriers
    description: Katalog kurir dan service canonical untuk client internal
  - name: Canonical - Rates
    description: Kalkulasi ongkir JSON menggunakan ID canonical
  - name: Canonical - Tracking
    description: Snapshot dan antrean tracking untuk client internal
  - name: Admin
    description: Operasional dashboard dengan admin API key terpisah

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      summary: Memeriksa proses API
      security: []
      responses:
        "200":
          description: Proses aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          description: Request health tidak dapat diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Memeriksa kesiapan API dan PostgreSQL
      security: []
      responses:
        "200":
          description: API siap menerima traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Dependency belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          description: Request health tidak dapat diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/destination/domestic-destination:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: searchDomesticDestination
      summary: Mencari master lokasi lokal dengan respons RajaOngkir V2
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: >
            Nama wilayah, kode pos, atau alamat mentah. Awalan administratif,
            tanda baca, nomor non-kode-pos, dan token duplikat dinormalisasi.
          schema:
            type: string
            minLength: 2
          example: Beji Depok
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Hasil pencarian
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirDestinationSearchResponse"
        "400":
          description: Parameter pencarian tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Parameter pencarian tidak lengkap atau tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/destination/province:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listProvinces
      summary: Mendapatkan daftar provinsi lokal
      responses:
        "200":
          description: Daftar provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/city/{province_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listCitiesByProvince
      summary: Mendapatkan kota/kabupaten berdasarkan ID provinsi
      parameters:
        - $ref: "#/components/parameters/ProvinceID"
      responses:
        "200":
          description: Daftar kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/district/{city_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listDistrictsByCity
      summary: Mendapatkan kecamatan berdasarkan ID kota/kabupaten
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Daftar kecamatan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/sub-district/{district_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listSubdistrictsByDistrict
      summary: Mendapatkan kelurahan/desa berdasarkan ID kecamatan
      parameters:
        - $ref: "#/components/parameters/DistrictID"
      responses:
        "200":
          description: Daftar kelurahan/desa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/couriers:
    get:
      tags: [RajaOngkir V2 - Couriers]
      operationId: listCouriers
      summary: Mendapatkan kurir dan layanan aktif
      responses:
        "200":
          description: Daftar kurir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/calculate/domestic-cost:
    post:
      tags: [RajaOngkir V2 - Rates]
      operationId: calculateDomesticCost
      summary: Menghitung ongkir dari rate card lokal atau exact provider quote
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan dan biaya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirCalculateCostResponse"
        "400":
          description: Parameter atau lokasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Courier tidak valid atau tarif belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider gagal atau menolak credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/calculate/district/domestic-cost:
    post:
      tags: [RajaOngkir V2 - Rates]
      operationId: calculateDistrictDomesticCost
      summary: Menghitung ongkir berdasarkan ID kecamatan seperti RajaOngkir V2
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan dan biaya dalam kontrak RajaOngkir V2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirCalculateCostResponse"
        "400":
          description: Parameter atau lokasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          description: API key tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "422":
          description: Courier tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider gagal atau menolak credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/track/waybill:
    post:
      tags: [RajaOngkir V2 - Tracking]
      operationId: trackWaybill
      summary: Melacak AWB secara sinkron seperti RajaOngkir V2
      description: >
        Path /api/v1 selalu memakai kontrak sinkron RajaOngkir V2 untuk header
        key maupun Bearer. Hasil sinkron memakai snapshot PostgreSQL yang masih
        fresh agar tidak selalu memakai hit provider.
      parameters:
        - name: awb
          in: query
          description: Wajib pada mode RajaOngkir V2
          schema:
            type: string
            minLength: 6
            maxLength: 40
        - name: courier
          in: query
          description: Wajib pada mode RajaOngkir V2
          schema:
            type: string
        - name: last_phone_number
          in: query
          description: Opsional; dipakai hanya bila courier meminta validasi telepon
          schema:
            type: string
            pattern: "^[0-9]{5}$"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirTrackingRequest"
      responses:
        "200":
          description: Tracking tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirTrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Courier belum didukung adapter aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "404":
          description: AWB tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider tracking gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Tracking belum dikonfigurasi atau provider sedang dibatasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "504":
          description: Provider tracking timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /regions/provinces:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyProvinces
      summary: Daftar provinsi kompatibel region-service Emisell lama
      description: Mengembalikan ID numerik dari dump RajaOngkir, bukan kode Kemendagri.
      responses:
        "200":
          description: Daftar provinsi lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/provinces/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyProvince
      summary: Detail provinsi kompatibel region-service lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/cities:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyCities
      summary: Daftar kota/kabupaten berdasarkan ID provinsi lama
      parameters:
        - name: provinceId
          in: query
          required: true
          schema:
            type: integer
          example: 5
      responses:
        "200":
          description: Daftar kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/cities/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyCity
      summary: Detail kota/kabupaten berdasarkan ID lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/districts:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyDistricts
      summary: Daftar kecamatan berdasarkan ID kota lama
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: integer
          example: 55
      responses:
        "200":
          description: Daftar kecamatan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/districts/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyDistrict
      summary: Detail kecamatan berdasarkan ID lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail kecamatan beserta kota dan provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/subdistricts:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacySubdistricts
      summary: Daftar kelurahan/desa berdasarkan ID kecamatan lama
      parameters:
        - name: districtId
          in: query
          required: true
          schema:
            type: integer
          example: 442
      responses:
        "200":
          description: Daftar kelurahan/desa beserta kode pos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /shipping/domestic-cost:
    get:
      tags: [Emisell Legacy]
      operationId: calculateLegacyDomesticCost
      summary: Cek ongkir kompatibel region-service Emisell lama
      description: Origin dan destination memakai ID district dari dump RajaOngkir.
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: integer
          example: 1354
        - name: destination
          in: query
          required: true
          schema:
            type: integer
          example: 2612
        - name: weight
          in: query
          required: true
          description: Berat aktual dalam gram
          schema:
            type: integer
            minimum: 1
          example: 1000
        - name: courier
          in: query
          description: Kode kurir dipisahkan titik dua; kosong berarti semua kurir default.
          schema:
            type: string
          example: jne:tiki
        - name: price
          in: query
          schema:
            type: string
            enum: [lowest, highest]
        - name: serviceName
          in: query
          description: Kelompok layanan, dapat dipisahkan koma.
          schema:
            type: string
          example: REG,TRUCKING
      responses:
        "200":
          description: Pilihan layanan pengiriman
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyShippingCostResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/LegacyProviderError"
        "502":
          $ref: "#/components/responses/LegacyProviderError"
        "503":
          $ref: "#/components/responses/LegacyProviderError"

  /v1/destination/domestic-destination:
    get:
      tags: [Canonical - Locations]
      operationId: searchCanonicalDomesticDestination
      summary: Mencari master lokasi dengan public ID canonical
      description: >
        Endpoint internal API Kurir. Alamat mentah dinormalisasi dan hasil
        memakai ID loc_idn_*. Jangan kirim ID numerik dari /api/v1.
      parameters:
        - name: search
          in: query
          required: true
          description: Nama wilayah, alamat mentah, atau kode pos
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Lokasi canonical yang cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/province:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalProvinces
      summary: Mendapatkan provinsi dengan public ID canonical
      responses:
        "200":
          description: Daftar provinsi canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/city/{province_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalCitiesByProvince
      summary: Mendapatkan kota/kabupaten dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/ProvinceID"
      responses:
        "200":
          description: Daftar kota/kabupaten canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/district/{city_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalDistrictsByCity
      summary: Mendapatkan kecamatan dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Daftar kecamatan canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/sub-district/{district_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalSubdistrictsByDistrict
      summary: Mendapatkan kelurahan/desa dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/DistrictID"
      responses:
        "200":
          description: Daftar kelurahan/desa canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/couriers:
    get:
      tags: [Canonical - Couriers]
      operationId: listCanonicalCouriers
      summary: Mendapatkan katalog kurir dan layanan canonical
      responses:
        "200":
          description: Daftar kurir dan capability aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calculate/domestic-cost:
    post:
      tags: [Canonical - Rates]
      operationId: calculateCanonicalDomesticCost
      summary: Menghitung ongkir dengan ID canonical
      description: >
        Request memakai JSON dan public ID loc_idn_*. Endpoint ini ditujukan
        untuk dashboard dan service internal, bukan SDK RajaOngkir V2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan beserta metadata berat dan sumber tarif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateCostResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderError"

  /v1/track/waybill:
    post:
      tags: [Canonical - Tracking]
      operationId: trackCanonicalWaybill
      summary: Membaca snapshot atau mengantrekan refresh tracking
      description: >
        Endpoint internal asynchronous. Nomor resi disimpan terenkripsi dan
        dikembalikan dalam bentuk termasking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "200":
          description: Snapshot tracking aktif atau status refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderError"

  /v1/admin/overview:
    get:
      tags: [Admin]
      operationId: adminOverview
      summary: Membaca metrik operasional
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Ringkasan dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/catalog:
    get:
      tags: [Admin]
      operationId: adminCatalog
      summary: Membaca kurir, layanan, dan rounding profile
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Katalog form admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminObjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/locations:
    get:
      tags: [Admin]
      operationId: adminSearchLocations
      summary: Mencari lokasi untuk form admin
      security:
        - adminBearerAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Hasil pencarian lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/couriers:
    get:
      tags: [Admin]
      operationId: adminListCouriers
      summary: Membaca kurir untuk alat cek ongkir dan resi admin
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Daftar kurir dan layanan aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/calculate/domestic-cost:
    post:
      tags: [Admin]
      operationId: adminCalculateDomesticCost
      summary: Menjalankan cek ongkir dari dashboard admin
      description: >
        Menggunakan rate engine, snapshot, mapping lazy, dan provider resolver
        yang sama dengan endpoint customer.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateCostRequest"
      responses:
        "200":
          description: Tarif ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateCostResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Tarif atau mapping belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/track/waybill:
    post:
      tags: [Admin]
      operationId: adminTrackWaybill
      summary: Menjalankan cek resi dari dashboard admin
      description: >
        Membaca snapshot tracking atau mengantrikan refresh melalui durable
        worker yang sama dengan endpoint customer.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "200":
          description: Snapshot tracking tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "202":
          description: Refresh tracking sudah diantrikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Tracking belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/rate-snapshots:
    get:
      tags: [Admin]
      operationId: adminListRateSnapshots
      summary: Membaca snapshot tarif yang tersimpan otomatis dari provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar snapshot tarif provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/location-mappings:
    get:
      tags: [Admin]
      operationId: adminListLocationMappings
      summary: Membaca mapping lokasi provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: provider
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar mapping lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/provider-quotas:
    get:
      tags: [Admin]
      operationId: adminListProviderQuotas
      summary: Membaca ledger kuota tanpa mengekspos key
      security:
        - adminBearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Riwayat pemakaian kuota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminObjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/provider-credentials:
    get:
      tags: [Admin]
      operationId: adminListProviderCredentials
      summary: Membaca credential provider tanpa secret
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Daftar metadata credential provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      operationId: adminAddProviderCredential
      summary: Memvalidasi dan menyimpan API key provider
      description: >
        Key divalidasi ke provider, dienkripsi AES-256-GCM, dan langsung
        tersedia untuk resolver runtime tanpa restart API.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderCredentialRequest"
      responses:
        "201":
          description: Credential valid dan aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Credential sudah tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Key ditolak oleh provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/provider-credentials/{id}/disable:
    post:
      tags: [Admin]
      operationId: adminDisableProviderCredential
      summary: Menonaktifkan credential provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "204":
          description: Credential dinonaktifkan
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Credential tidak ditemukan atau sudah nonaktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/api-keys:
    get:
      tags: [Admin]
      operationId: adminListCustomerAPIKeys
      summary: Membaca metadata customer API key
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar key tanpa secret dan hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAPIKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      operationId: adminGenerateCustomerAPIKey
      summary: Membuat customer API key
      description: >
        Secret lengkap hanya dikembalikan pada response pembuatan ini.
        Database hanya menyimpan hash SHA-256. Key dibuat tanpa nama,
        tidak kedaluwarsa, dan aktif sampai di-revoke.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "201":
          description: Key berhasil dibuat; secret wajib disimpan sekarang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCustomerAPIKeyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/api-keys/{id}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokeCustomerAPIKey
      summary: Mencabut akses satu customer API key
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "204":
          description: Key berhasil dicabut
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Key tidak ditemukan atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    rajaOngkirKeyAuth:
      type: apiKey
      in: header
      name: key
      description: Alternatif pengiriman customer API key; tidak mengubah kontrak path
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Admin API key

  parameters:
    Search:
      name: search
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProvinceID:
      name: province_id
      in: path
      required: true
      description: >
        ID provinsi dari endpoint daftar provinsi. Pada /api/v1 nilainya adalah
        ID dump RajaOngkir; pada /v1 nilainya public ID canonical.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 5
    CityID:
      name: city_id
      in: path
      required: true
      description: >
        ID kota/kabupaten dari endpoint daftar kota dengan namespace sesuai
        base path API.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 55
    DistrictID:
      name: district_id
      in: path
      required: true
      description: >
        ID kecamatan dari endpoint daftar kecamatan dengan namespace sesuai
        base path API.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 442
    LegacyRegionID:
      name: id
      in: path
      required: true
      description: ID numerik dari dump region-service RajaOngkir.
      schema:
        type: integer
      example: 55
    AdminActor:
      name: X-Admin-Actor
      in: header
      schema:
        type: string
        maxLength: 64

  responses:
    InvalidRequest:
      description: Payload atau parameter tidak valid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"
    Unauthorized:
      description: API key tidak valid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"
    ProviderError:
      description: Provider belum tersedia, timeout, atau kuotanya habis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LegacyRegionNotFound:
      description: ID wilayah lama tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyRegionErrorResponse"
    LegacyInvalidRequest:
      description: Parameter kompatibilitas lama tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyRegionErrorResponse"
    LegacyProviderError:
      description: Tarif belum tersedia atau provider gagal merespons
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyRegionErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ready]

    LegacyRegion:
      type: object
      required: [id, name]
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
        zipCode:
          type: string
        provinceId:
          oneOf:
            - type: integer
            - type: string
        provinceName:
          type: string
        cityId:
          oneOf:
            - type: integer
            - type: string
        cityName:
          type: string
        districtId:
          oneOf:
            - type: integer
            - type: string

    LegacyRegionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LegacyRegion"

    LegacyRegionDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LegacyRegion"

    LegacyRegionErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LegacyShippingCost:
      type: object
      required: [name, code, service, description, cost, etd, serviceName]
      properties:
        name:
          type: string
        code:
          type: string
        service:
          type: string
        description:
          type: string
        cost:
          type: integer
          minimum: 0
        etd:
          type: string
        serviceName:
          type: string
          enum: [REG, EXPRESS, SAMEDAY, ECONOMY, TRUCKING, CARGO, MOTOR, OTHER]

    LegacyShippingCostResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status]
          properties:
            message:
              type: string
            code:
              type: integer
            status:
              type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/LegacyShippingCost"

    Location:
      type: object
      required:
        - id
        - label
        - province_id
        - city_id
        - district_id
        - subdistrict_id
        - province_name
        - city_name
        - district_name
        - subdistrict_name
        - zip_code
      properties:
        id:
          type: string
          description: ID lokasi akhir yang dipakai sebagai origin atau destination
        label:
          type: string
        province_id:
          type: string
        city_id:
          type: string
        district_id:
          type: string
        subdistrict_id:
          type: string
        province_name:
          type: string
        city_name:
          type: string
        district_name:
          type: string
        subdistrict_name:
          type: string
        zip_code:
          type: string
          pattern: "^[0-9]{5}$"
        province:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk province_name
        city:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk city_name
        district:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk district_name
        subdistrict:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk subdistrict_name
        postal_code:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk zip_code
          pattern: "^[0-9]{5}$"
        postal_codes:
          type: array
          description: Semua kode pos aktif yang terhubung dengan lokasi
          items:
            type: string
            pattern: "^[0-9]{5}$"

    LocationSearchResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status, request_id]
          properties:
            message:
              type: string
              examples: [Success Get Domestic Destinations]
            code:
              type: integer
              examples: [200]
            status:
              type: string
              examples: [success]
            request_id:
              type: string
            next_cursor:
              type: [string, "null"]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    HierarchyLocation:
      type: object
      required: [id, name]
      properties:
        id:
          oneOf:
            - type: integer
              format: int64
            - type: string
          description: >
            ID unik pada level dan base path ini. Jangan menafsirkan angka pada
            /api/v1 sebagai kode Kemendagri.
        name:
          type: string
        zip_code:
          type: string
          description: Kode pos utama jika tersedia

    LocationHierarchyResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status]
          properties:
            message:
              type: string
            code:
              type: integer
              examples: [200]
            status:
              type: string
              examples: [success]
            request_id:
              type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyLocation"

    CourierService:
      type: object
      required: [code, name, group, service_type, calculation_mode]
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
          enum:
            - economy
            - regular
            - next_day
            - express
            - same_day
            - instant
            - cargo
            - international
            - special
            - unknown
        service_type:
          type: string
          enum: [parcel, cargo, same_day, instant, international]
        calculation_mode:
          type: string
          enum: [local_rate_card, provider_quote]

    Courier:
      type: object
      required:
        - code
        - name
        - provider_code
        - supports_domestic_cost
        - supports_international_cost
        - supports_tracking
        - catalog_source
        - catalog_verified_at
        - services
      properties:
        code:
          type: string
        name:
          type: string
        provider_code:
          type: string
        supports_domestic_cost:
          type: boolean
        supports_international_cost:
          type: boolean
        supports_tracking:
          type: boolean
        catalog_source:
          type: string
          format: uri
        catalog_verified_at:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: "#/components/schemas/CourierService"

    CourierListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Courier"

    CalculateCostRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, weight, courier]
      properties:
        origin:
          type: string
        destination:
          type: string
        weight:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Berat aktual dalam gram
        courier:
          type: string
          pattern: "^[a-zA-Z0-9_-]+(:[a-zA-Z0-9_-]+)*$"
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        item_value:
          type: integer
          minimum: 0
        options:
          $ref: "#/components/schemas/CalculateOptions"

    RajaOngkirCalculateCostRequest:
      type: object
      required: [origin, destination, weight, courier]
      properties:
        origin:
          type: integer
          format: int64
          description: ID RajaOngkir lokal sesuai level endpoint calculate
          examples: [4911]
        destination:
          type: integer
          format: int64
          description: ID RajaOngkir lokal sesuai level endpoint calculate
          examples: [25976]
        weight:
          type: integer
          format: int64
          minimum: 1
        courier:
          type: string
          pattern: "^[a-z0-9_-]+(:[a-z0-9_-]+)*$"
        price:
          type: string
          enum: [lowest, highest]

    Dimensions:
      type: object
      additionalProperties: false
      required: [length, width, height, unit]
      properties:
        length:
          type: integer
          minimum: 1
          maximum: 10000
        width:
          type: integer
          minimum: 1
          maximum: 10000
        height:
          type: integer
          minimum: 1
          maximum: 10000
        unit:
          type: string
          const: cm

    CalculateOptions:
      type: object
      additionalProperties: false
      properties:
        include_insurance:
          type: boolean
          default: false
        include_unverified:
          type: boolean
          default: false

    CalculateCostResponse:
      type: object
      required: [meta, data, warnings]
      properties:
        meta:
          type: object
          required: [request_id, calculated_at, currency]
          properties:
            request_id:
              type: string
            calculated_at:
              type: string
              format: date-time
            currency:
              type: string
              const: IDR
        data:
          type: array
          items:
            $ref: "#/components/schemas/RateResult"
        warnings:
          type: array
          items:
            type: string

    RajaOngkirCalculateCostResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: array
          items:
            type: object
            required: [name, code, service, description, cost, etd]
            properties:
              name:
                type: string
              code:
                type: string
              service:
                type: string
              description:
                type: string
              cost:
                type: integer
                format: int64
              etd:
                type: string

    RajaOngkirMeta:
      type: object
      required: [message, code, status]
      properties:
        message:
          type: string
        code:
          type: integer
        status:
          type: string
          enum: [success, error, failed]

    RajaOngkirDestinationSearchResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: array
          items:
            type: object
            required:
              - id
              - label
              - province_name
              - city_name
              - district_name
              - subdistrict_name
              - zip_code
            properties:
              id:
                type: integer
                format: int64
              label:
                type: string
              province_name:
                type: string
              city_name:
                type: string
              district_name:
                type: string
              subdistrict_name:
                type: string
              zip_code:
                type: string

    RajaOngkirErrorResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: "null"

    RateResult:
      type: object
      required: [courier, service, cost, etd, weight, breakdown, source]
      properties:
        courier:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
            name:
              type: string
        service:
          type: object
          required:
            - code
            - name
            - canonical_code
            - group
            - type
            - variant_code
          properties:
            code:
              type: string
            name:
              type: string
            canonical_code:
              type: string
              description: Kode service stabil milik API Kurir
            group:
              type: string
              enum:
                - economy
                - regular
                - next_day
                - express
                - same_day
                - instant
                - cargo
                - international
                - special
                - unknown
            type:
              type: string
              enum:
                - parcel
                - cargo
                - same_day
                - instant
                - international
                - unknown
            variant_code:
              type: string
              description: Kode mentah jika merupakan varian canonical
        cost:
          type: integer
          minimum: 0
        etd:
          type: object
          required: [text]
          properties:
            min_days:
              type: [integer, "null"]
            max_days:
              type: [integer, "null"]
            text:
              type: string
        weight:
          $ref: "#/components/schemas/WeightBreakdown"
        breakdown:
          $ref: "#/components/schemas/CostBreakdown"
        source:
          $ref: "#/components/schemas/RateSource"

    WeightBreakdown:
      type: object
      required:
        - actual_grams
        - volumetric_grams
        - chargeable_grams
        - rounded_grams
        - billing_grams
        - minimum_grams
        - rounding_profile
      properties:
        actual_grams:
          type: integer
        volumetric_grams:
          type: integer
        chargeable_grams:
          type: integer
        rounded_grams:
          type: integer
        billing_grams:
          type: integer
        minimum_grams:
          type: integer
        rounding_profile:
          type: string

    CostBreakdown:
      type: object
      required: [shipping, surcharge, insurance, tax, total]
      properties:
        shipping:
          type: integer
        surcharge:
          type: integer
        insurance:
          type: integer
        tax:
          type: integer
        total:
          type: integer

    RateSource:
      type: object
      required:
        - type
        - provider
        - verification_status
        - effective_from
        - fetched_at
        - is_stale
      properties:
        type:
          type: string
          enum: [local_rate_card, provider_quote]
        provider:
          type: string
        verification_status:
          type: string
        effective_from:
          type: string
          format: date
        fetched_at:
          type: string
          format: date-time
        is_stale:
          type: boolean

    TrackingRequest:
      type: object
      additionalProperties: false
      required: [waybill, courier]
      properties:
        waybill:
          type: string
          minLength: 6
          maxLength: 40
          pattern: "^[A-Za-z0-9-]+$"
        courier:
          type: string
          enum: [jne, sap, ninja, jnt, tiki, wahana, pos, lion]
        last_phone_number:
          type: string
          pattern: "^[0-9]{5}$"
          description: >
            Konteks provider opsional untuk kompatibilitas. Dashboard tidak
            memintanya. Jika dikirim, nilainya dienkripsi dan tidak
            dikembalikan pada response.
        refresh:
          type: string
          const: if_stale
          default: if_stale

    RajaOngkirTrackingRequest:
      type: object
      required: [awb, courier]
      properties:
        awb:
          type: string
          minLength: 6
          maxLength: 40
          pattern: "^[A-Za-z0-9-]+$"
        courier:
          type: string
        last_phone_number:
          type: string
          pattern: "^[0-9]{5}$"
          description: Opsional; isi hanya ketika provider meminta validasi telepon

    RajaOngkirTrackingResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: object
          required:
            - delivered
            - summary
            - details
            - delivery_status
            - manifest
          properties:
            delivered:
              type: boolean
            summary:
              $ref: "#/components/schemas/RajaOngkirTrackingSummary"
            details:
              $ref: "#/components/schemas/RajaOngkirTrackingDetails"
            delivery_status:
              $ref: "#/components/schemas/RajaOngkirDeliveryStatus"
            manifest:
              type: array
              items:
                $ref: "#/components/schemas/RajaOngkirManifest"

    RajaOngkirTrackingSummary:
      type: object
      required:
        - courier_code
        - courier_name
        - waybill_number
        - service_code
        - waybill_date
        - shipper_name
        - receiver_name
        - origin
        - destination
        - status
      properties:
        courier_code:
          type: string
        courier_name:
          type: string
        waybill_number:
          type: string
        service_code:
          type: string
        waybill_date:
          type: string
        shipper_name:
          type: string
        receiver_name:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          type: string

    RajaOngkirTrackingDetails:
      type: object
      required:
        - waybill_number
        - waybill_date
        - waybill_time
        - weight
        - origin
        - destination
        - shipper_name
        - shipper_address1
        - shipper_address2
        - shipper_address3
        - shipper_city
        - receiver_name
        - receiver_address1
        - receiver_address2
        - receiver_address3
        - receiver_city
      properties:
        waybill_number:
          type: string
        waybill_date:
          type: string
        waybill_time:
          type: string
        weight:
          type: string
        origin:
          type: string
        destination:
          type: string
        shipper_name:
          type: string
        shipper_address1:
          type: string
        shipper_address2:
          type: string
        shipper_address3:
          type: string
        shipper_city:
          type: string
        receiver_name:
          type: string
        receiver_address1:
          type: string
        receiver_address2:
          type: string
        receiver_address3:
          type: string
        receiver_city:
          type: string

    RajaOngkirDeliveryStatus:
      type: object
      required: [status, pod_receiver, pod_date, pod_time]
      properties:
        status:
          type: string
        pod_receiver:
          type: string
        pod_date:
          type: string
        pod_time:
          type: string

    RajaOngkirManifest:
      type: object
      required:
        - manifest_code
        - manifest_description
        - manifest_date
        - manifest_time
        - city_name
      properties:
        manifest_code:
          type: string
        manifest_description:
          type: string
        manifest_date:
          type: string
        manifest_time:
          type: string
        city_name:
          type: string

    TrackingEvent:
      type: object
      required: [code, description, occurred_at]
      properties:
        code:
          type: string
        description:
          type: string
        location:
          type: string
        occurred_at:
          type: string
          format: date-time

    TrackingShipment:
      type: object
      required:
        - courier
        - waybill
        - status
        - status_label
        - summary
        - events
        - provider
        - is_final
        - refresh_queued
      properties:
        courier:
          type: string
        waybill:
          type: string
          description: Nomor resi yang sudah dimasking
        status:
          type: string
          enum:
            - pending_pickup
            - picked_up
            - in_transit
            - out_for_delivery
            - delivered
            - delivery_failed
            - returned
            - cancelled
            - unknown
        status_label:
          type: string
        summary:
          type: object
          additionalProperties: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvent"
        provider:
          type: string
        provider_fetched_at:
          type: [string, "null"]
          format: date-time
        next_refresh_at:
          type: [string, "null"]
          format: date-time
        is_final:
          type: boolean
        refresh_queued:
          type: boolean

    TrackingResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TrackingShipment"

    RequestMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string

    AdminOverview:
      type: object
      required:
        - active_rate_cards
        - official_locations
        - location_mappings
        - fresh_quote_snapshots
        - quota_used_today
        - quota_limit_today
        - tracking_pending_jobs
        - tracking_shipments
      properties:
        active_rate_cards:
          type: integer
          deprecated: true
          description: Kompatibilitas skema lama; dashboard tidak menggunakannya.
        official_locations:
          type: integer
          description: Jumlah master wilayah aktif dari dataset lokal resmi.
        location_mappings:
          type: integer
        fresh_quote_snapshots:
          type: integer
        quota_used_today:
          type: integer
        quota_limit_today:
          type: integer
        tracking_pending_jobs:
          type: integer
        tracking_shipments:
          type: integer

    AdminOverviewResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/AdminOverview"

    AdminObjectResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}

    AdminListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          allOf:
            - $ref: "#/components/schemas/RequestMeta"
            - type: object
              properties:
                limit:
                  type: integer
                offset:
                  type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    CustomerAPIKey:
      type: object
      required:
        - id
        - key_prefix
        - key_last_four
        - display_key
        - scopes
        - active
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
          description: Prefix aman untuk mengenali key.
        key_last_four:
          type: string
          minLength: 4
          maxLength: 4
        display_key:
          type: string
          description: Bentuk termasking; bukan secret yang dapat dipakai.
        scopes:
          type: array
          items:
            type: string
            enum: ["shipping:read", "tracking:read"]
        active:
          type: boolean
        last_used_at:
          type: [string, "null"]
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_by:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]
          format: date-time

    ProviderCredential:
      type: object
      required:
        - id
        - provider_code
        - credential_alias
        - display_key
        - daily_limit
        - active
        - validation_status
        - last_validated_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        provider_code:
          type: string
          enum: [rajaongkir]
        credential_alias:
          type: string
        display_key:
          type: string
          description: Bentuk termasking; secret asli tidak dikembalikan.
        daily_limit:
          type: integer
        active:
          type: boolean
        validation_status:
          type: string
          enum: [valid, invalid]
        last_validated_at:
          type: string
          format: date-time
        last_selected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    CreateProviderCredentialRequest:
      type: object
      additionalProperties: false
      required: [provider_code, api_key]
      properties:
        provider_code:
          type: string
          enum: [rajaongkir]
        api_key:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true

    ProviderCredentialResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/ProviderCredential"

    ProviderCredentialListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCredential"

    CustomerAPIKeyListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          allOf:
            - $ref: "#/components/schemas/RequestMeta"
            - type: object
              properties:
                limit:
                  type: integer
                offset:
                  type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/CustomerAPIKey"

    GeneratedCustomerAPIKey:
      type: object
      required: [api_key, secret]
      properties:
        api_key:
          $ref: "#/components/schemas/CustomerAPIKey"
        secret:
          type: string
          description: Secret sekali tampil dengan prefix ek_live_.
          pattern: "^ek_live_[A-Za-z0-9_-]{43}$"

    GeneratedCustomerAPIKeyResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/GeneratedCustomerAPIKey"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: [object, "null"]
              additionalProperties: true
