openapi: 3.1.0
info:
  title: API Kurir
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >
    API ongkir internal Emisell. Endpoint customer pada /api/v1 kompatibel
    dengan kontrak shipping-cost RajaOngkir V2 dan memakai ID numerik dump
    region-service RajaOngkir; /v1 memakai kontrak canonical untuk client
    internal. Header key dan Bearer hanya cara autentikasi dan tidak mengubah
    bentuk respons. Uang menggunakan integer rupiah dan berat menggunakan gram.
servers:
  - url: /
    description: Host API Kurir aktif
security:
  - bearerAuth: []
  - rajaOngkirKeyAuth: []
tags:
  - name: Health
    description: Liveness dan readiness service
  - name: RajaOngkir V2 - Locations
    description: Master lokasi dengan ID numerik dan envelope RajaOngkir V2
  - name: RajaOngkir V2 - Couriers
    description: Kurir serta layanan pada façade RajaOngkir V2
  - name: RajaOngkir V2 - Rates
    description: Kalkulasi ongkir form-urlencoded pada façade RajaOngkir V2
  - name: RajaOngkir V2 - Tracking
    description: Tracking AWB sinkron dengan envelope RajaOngkir V2
  - name: Emisell Legacy
    description: Façade kompatibilitas region-service dan shipping lama
  - name: Canonical - Locations
    description: Master lokasi internal dengan public ID loc_idn_*
  - name: Canonical - Couriers
    description: Katalog kurir dan service canonical untuk client internal
  - name: Canonical - Rates
    description: Kalkulasi ongkir JSON menggunakan ID canonical
  - name: Canonical - Tracking
    description: Snapshot dan antrean tracking untuk client internal
  - name: Emisell Gateway
    description: Credential BYOK dan pilihan layanan checkout yang terisolasi per merchant Emisell
  - name: Admin
    description: Operasional dashboard dengan admin API key terpisah
  - name: Partner Portal
    description: Upload package yang terisolasi oleh access key milik satu provider

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      summary: Memeriksa proses API
      security: []
      responses:
        "200":
          description: Proses aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          description: Request health tidak dapat diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Memeriksa kesiapan API dan PostgreSQL
      security: []
      responses:
        "200":
          description: API siap menerima traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Dependency belum siap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "4XX":
          description: Request health tidak dapat diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/destination/domestic-destination:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: searchDomesticDestination
      summary: Mencari master lokasi lokal dengan respons RajaOngkir V2
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      parameters:
        - name: search
          in: query
          required: true
          description: >
            Nama wilayah, kode pos, atau alamat mentah. Awalan administratif,
            tanda baca, nomor non-kode-pos, dan token duplikat dinormalisasi.
          schema:
            type: string
            minLength: 2
          example: Beji Depok
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Hasil pencarian
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirDestinationSearchResponse"
        "400":
          description: Parameter pencarian tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Parameter pencarian tidak lengkap atau tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/destination/province:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listProvinces
      summary: Mendapatkan daftar provinsi lokal
      responses:
        "200":
          description: Daftar provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/city/{province_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listCitiesByProvince
      summary: Mendapatkan kota/kabupaten berdasarkan ID provinsi
      parameters:
        - $ref: "#/components/parameters/ProvinceID"
      responses:
        "200":
          description: Daftar kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/district/{city_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listDistrictsByCity
      summary: Mendapatkan kecamatan berdasarkan ID kota/kabupaten
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Daftar kecamatan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/destination/sub-district/{district_id}:
    get:
      tags: [RajaOngkir V2 - Locations]
      operationId: listSubdistrictsByDistrict
      summary: Mendapatkan kelurahan/desa berdasarkan ID kecamatan
      parameters:
        - $ref: "#/components/parameters/DistrictID"
      responses:
        "200":
          description: Daftar kelurahan/desa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/couriers:
    get:
      tags: [RajaOngkir V2 - Couriers]
      operationId: listCouriers
      summary: Mendapatkan kurir dan layanan aktif
      responses:
        "200":
          description: Daftar kurir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/calculate/domestic-cost:
    post:
      tags: [RajaOngkir V2 - Rates]
      operationId: calculateDomesticCost
      summary: Menghitung ongkir dari rate card lokal atau exact provider quote
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/MerchantIDHeader"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan dan biaya
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirCalculateCostResponse"
        "400":
          description: Parameter atau lokasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Merchant belum mengaktifkan provider pengiriman
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "415":
          $ref: "#/components/responses/RajaOngkirUnsupportedMediaType"
        "422":
          description: Courier tidak valid atau tarif belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider gagal atau menolak credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/calculate/district/domestic-cost:
    post:
      tags: [RajaOngkir V2 - Rates]
      operationId: calculateDistrictDomesticCost
      summary: Menghitung ongkir berdasarkan ID kecamatan seperti RajaOngkir V2
      description: >
        Pada public API tanpa X-Emisell-Merchant-ID, courier wajib dikirim seperti
        RajaOngkir V2. Pada Emisell Gateway dengan Merchant ID, courier tidak
        diperlukan dan nilai dari client lama diabaikan; API Kurir mengambil
        kurir dari service yang dipilih merchant. Provider bawaan Emisell memakai
        pool credential platform secara internal, sedangkan provider RajaOngkir
        BYOK memakai credential tenant; credential_id tidak dikirim Main Service.
      security:
        - bearerAuth: []
        - rajaOngkirKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/MerchantIDHeader"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RajaOngkirCalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan dan biaya dalam kontrak RajaOngkir V2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirCalculateCostResponse"
        "400":
          description: Parameter atau lokasi tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "401":
          description: API key tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "409":
          description: Merchant belum mengaktifkan provider pengiriman
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "415":
          $ref: "#/components/responses/RajaOngkirUnsupportedMediaType"
        "422":
          description: Courier public tidak valid atau merchant belum memilih service checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider gagal atau menolak credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /api/v1/track/waybill:
    post:
      tags: [RajaOngkir V2 - Tracking]
      operationId: trackWaybill
      summary: Melacak AWB secara sinkron seperti RajaOngkir V2
      description: >
        Path /api/v1 selalu memakai kontrak sinkron RajaOngkir V2 untuk header
        key maupun Bearer. Hasil sinkron memakai snapshot PostgreSQL yang masih
        fresh agar tidak selalu memakai hit provider. Untuk Emisell Kurir,
        provider aktual dapat berupa Biteship ketika RajaOngkir tidak mencakup
        kurir atau gagal, tanpa mengubah bentuk respons kompatibilitas.
      parameters:
        - $ref: "#/components/parameters/MerchantIDHeader"
        - name: awb
          in: query
          description: Wajib pada mode RajaOngkir V2
          schema:
            type: string
            minLength: 6
            maxLength: 40
        - name: courier
          in: query
          description: Wajib pada mode RajaOngkir V2
          schema:
            type: string
        - name: last_phone_number
          in: query
          description: Opsional; dipakai hanya bila courier meminta validasi telepon
          schema:
            type: string
            pattern: "^[0-9]{5}$"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RajaOngkirTrackingRequest"
      responses:
        "200":
          description: Tracking tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirTrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Courier belum didukung adapter aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "404":
          description: AWB tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "502":
          description: Provider tracking gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "503":
          description: Tracking belum dikonfigurasi atau provider sedang dibatasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"
        "504":
          description: Provider tracking timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RajaOngkirErrorResponse"

  /regions/provinces:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyProvinces
      summary: Daftar provinsi kompatibel region-service Emisell lama
      description: Mengembalikan ID numerik dari dump RajaOngkir, bukan kode Kemendagri.
      responses:
        "200":
          description: Daftar provinsi lama
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/provinces/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyProvince
      summary: Detail provinsi kompatibel region-service lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/cities:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyCities
      summary: Daftar kota/kabupaten berdasarkan ID provinsi lama
      parameters:
        - name: provinceId
          in: query
          required: true
          schema:
            type: integer
          example: 5
      responses:
        "200":
          description: Daftar kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/cities/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyCity
      summary: Detail kota/kabupaten berdasarkan ID lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail kota/kabupaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/districts:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacyDistricts
      summary: Daftar kecamatan berdasarkan ID kota lama
      parameters:
        - name: cityId
          in: query
          required: true
          schema:
            type: integer
          example: 55
      responses:
        "200":
          description: Daftar kecamatan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /regions/districts/{id}:
    get:
      tags: [Emisell Legacy]
      operationId: getLegacyDistrict
      summary: Detail kecamatan berdasarkan ID lama
      parameters:
        - $ref: "#/components/parameters/LegacyRegionID"
      responses:
        "200":
          description: Detail kecamatan beserta kota dan provinsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/LegacyRegionNotFound"

  /regions/subdistricts:
    get:
      tags: [Emisell Legacy]
      operationId: listLegacySubdistricts
      summary: Daftar kelurahan/desa berdasarkan ID kecamatan lama
      parameters:
        - name: districtId
          in: query
          required: true
          schema:
            type: integer
          example: 442
      responses:
        "200":
          description: Daftar kelurahan/desa beserta kode pos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyRegionListResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /shipping/domestic-cost:
    get:
      tags: [Emisell Legacy]
      operationId: calculateLegacyDomesticCost
      summary: Cek ongkir kompatibel region-service Emisell lama
      description: Origin dan destination memakai ID district dari dump RajaOngkir.
      parameters:
        - name: origin
          in: query
          required: true
          schema:
            type: integer
          example: 1354
        - name: destination
          in: query
          required: true
          schema:
            type: integer
          example: 2612
        - name: weight
          in: query
          required: true
          description: Berat final/chargeable dari Emisell dalam gram
          schema:
            type: integer
            minimum: 1
          example: 1000
        - name: courier
          in: query
          description: Kode kurir dipisahkan titik dua; kosong berarti semua kurir default.
          schema:
            type: string
          example: jne:tiki
        - name: price
          in: query
          schema:
            type: string
            enum: [lowest, highest]
        - name: serviceName
          in: query
          description: Kelompok layanan, dapat dipisahkan koma.
          schema:
            type: string
          example: REG,TRUCKING
      responses:
        "200":
          description: Pilihan layanan pengiriman
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyShippingCostResponse"
        "400":
          $ref: "#/components/responses/LegacyInvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/LegacyProviderError"
        "502":
          $ref: "#/components/responses/LegacyProviderError"
        "503":
          $ref: "#/components/responses/LegacyProviderError"

  /v1/destination/domestic-destination:
    get:
      tags: [Canonical - Locations]
      operationId: searchCanonicalDomesticDestination
      summary: Mencari master lokasi dengan public ID canonical
      description: >
        Endpoint internal API Kurir. Alamat mentah dinormalisasi dan hasil
        memakai ID loc_idn_*. Jangan kirim ID numerik dari /api/v1.
      parameters:
        - name: search
          in: query
          required: true
          description: Nama wilayah, alamat mentah, atau kode pos
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
      responses:
        "200":
          description: Lokasi canonical yang cocok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/province:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalProvinces
      summary: Mendapatkan provinsi dengan public ID canonical
      responses:
        "200":
          description: Daftar provinsi canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/city/{province_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalCitiesByProvince
      summary: Mendapatkan kota/kabupaten dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/ProvinceID"
      responses:
        "200":
          description: Daftar kota/kabupaten canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/district/{city_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalDistrictsByCity
      summary: Mendapatkan kecamatan dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/CityID"
      responses:
        "200":
          description: Daftar kecamatan canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/destination/sub-district/{district_id}:
    get:
      tags: [Canonical - Locations]
      operationId: listCanonicalSubdistrictsByDistrict
      summary: Mendapatkan kelurahan/desa dengan public ID canonical
      parameters:
        - $ref: "#/components/parameters/DistrictID"
      responses:
        "200":
          description: Daftar kelurahan/desa canonical
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/couriers:
    get:
      tags: [Canonical - Couriers]
      operationId: listCanonicalCouriers
      summary: Mendapatkan katalog kurir dan layanan canonical
      responses:
        "200":
          description: Daftar kurir dan capability aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/calculate/domestic-cost:
    post:
      tags: [Canonical - Rates]
      operationId: calculateCanonicalDomesticCost
      summary: Menghitung ongkir dengan ID canonical
      description: >
        Request memakai JSON dan public ID loc_idn_*. Endpoint ini ditujukan
        untuk dashboard dan service internal, bukan SDK RajaOngkir V2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateCostRequest"
      responses:
        "200":
          description: Pilihan layanan beserta metadata berat dan sumber tarif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateCostResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "502":
          $ref: "#/components/responses/ProviderError"
        "503":
          $ref: "#/components/responses/ProviderError"

  /v1/track/waybill:
    post:
      tags: [Canonical - Tracking]
      operationId: trackCanonicalWaybill
      summary: Membaca snapshot atau mengantrekan refresh tracking
      description: >
        Endpoint internal asynchronous. Nomor resi disimpan plaintext agar
        backend Emisell dan webhook menerima nilai lengkap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "200":
          description: Snapshot tracking aktif atau status refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderError"

  /api/v1/integrations/provider-credentials:
    get:
      tags: [Emisell Gateway]
      operationId: listTenantProviderCredentials
      summary: Membaca credential provider milik merchant terautentikasi
      description: Secret, tenant_id, dan UUID credential internal tidak pernah dikembalikan.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      responses:
        "200":
          description: Daftar metadata credential milik merchant pada header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProviderCredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Emisell Gateway]
      operationId: addTenantProviderCredential
      summary: Memvalidasi dan menyimpan key provider milik seller
      description: >
        Merchant ditentukan dari X-Emisell-Merchant-ID. Validasi key memakai
        satu hit provider lalu secret dienkripsi AES-256-GCM. Key baru
        menggantikan key aktif lama untuk merchant dan provider yang sama. Key
        milik merchant yang sama yang pernah dinonaktifkan akan diaktifkan
        kembali tanpa membuat credential duplikat dan tanpa mengaktifkan
        provider shipping secara otomatis.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantProviderCredentialRequest"
      responses:
        "201":
          description: Credential seller valid dan aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantProviderCredentialResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Credential terikat pada scope atau merchant lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Key ditolak provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/provider-credentials/{provider_code}/disable:
    post:
      tags: [Emisell Gateway]
      operationId: disableTenantProviderCredential
      summary: Menonaktifkan credential provider milik seller
      description: Emisell tidak perlu menyimpan UUID credential internal.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
      responses:
        "204":
          description: Credential dinonaktifkan
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Merchant tidak mempunyai credential aktif untuk provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/providers:
    get:
      tags: [Emisell Gateway]
      operationId: getTenantShippingProviders
      summary: Membaca katalog extension provider dan provider aktif merchant
      description: >
        Emisell Kurir selalu terpasang sebagai provider bawaan. Provider
        eksternal dianggap terpasang bila merchant mempunyai credential aktif
        dan valid. Maksimal satu provider efektif aktif; tenant tanpa konfigurasi
        eksplisit tidak mempunyai provider aktif dan memakai version 0. Hanya
        provider available yang dikirim; provider yang dinonaktifkan operator
        otomatis hilang dari katalog dashboard seller.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      responses:
        "200":
          description: Katalog provider dan pilihan aktif merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantShippingProviderCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/integrations/providers/{provider_code}/activate:
    post:
      tags: [Emisell Gateway]
      operationId: activateTenantShippingProvider
      summary: Mengaktifkan satu extension provider untuk checkout merchant
      description: >
        Operasi atomik dan idempotent. API Kurir memilih credential aktif dan
        valid milik merchant untuk provider tersebut secara otomatis.
        expected_version mencegah dua perubahan dashboard saling menimpa.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantShippingProviderChangeRequest"
      responses:
        "200":
          description: Provider aktif sudah diganti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantShippingProviderCatalogResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Provider tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider belum tersedia atau version sudah berubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Merchant belum mempunyai credential aktif dan valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/providers/{provider_code}/deactivate:
    post:
      tags: [Emisell Gateway]
      operationId: deactivateTenantShippingProvider
      summary: Menonaktifkan provider shipping merchant
      description: >
        Bila provider tersebut sedang aktif, shipping merchant dinonaktifkan
        secara atomik tanpa memilih provider pengganti. Menonaktifkan provider
        yang sudah tidak aktif bersifat idempotent. Emisell Kurir juga dapat
        dinonaktifkan.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantShippingProviderChangeRequest"
      responses:
        "200":
          description: Provider efektif merchant sesudah penonaktifan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantShippingProviderCatalogResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Version sudah berubah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/integrations/shipping-services:
    get:
      tags: [Emisell Gateway]
      operationId: getTenantShippingServices
      summary: Membaca katalog dan pilihan layanan checkout merchant
      description: >
        Mengembalikan katalog canonical beserta selected dan selection_state
        untuk membangun checkbox kurir bertingkat. Response juga memuat limit,
        pemakaian, sisa pilihan, dan selectable pada setiap kurir/layanan.
        Katalog selalu mengikuti provider yang sedang aktif dan pilihan layanan
        disimpan terpisah untuk setiap provider, sehingga pergantian provider
        tidak menimpa konfigurasi provider sebelumnya.
        Hanya grup regular, next_day, economy, dan cargo yang dikirim ke
        Emisell. Tenant tanpa preference mulai dari nol pilihan dan tidak
        memperoleh opsi checkout sebelum menyimpan layanan custom.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      responses:
        "200":
          description: Katalog dan preference merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantShippingCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Emisell Gateway]
      operationId: replaceTenantShippingServices
      summary: Mengganti pilihan layanan checkout merchant
      description: >
        Update atomik untuk pilihan custom per layanan. Mode groups dan all tidak
        diterima. mode boleh dihilangkan atau diisi custom untuk kompatibilitas;
        enabled_groups harus kosong. Merchant selalu berasal dari header dan
        tidak diterima dari body. Request yang melampaui limit kurir atau layanan
        ditolak tanpa mengubah preference lama.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantShippingPreferenceUpdateRequest"
      responses:
        "200":
          description: Preference sudah disimpan dan dinormalisasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantShippingPreferenceResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Layanan tidak tersedia atau pilihan melampaui limit merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tracking/verify:
    post:
      tags: [Emisell Gateway]
      operationId: verifyTrackingWaybill
      summary: Verifikasi AWB dan deteksi salah ekspedisi
      description: >
        Courier pilihan diperiksa lebih dulu. Bila AWB tidak ditemukan, maksimal
        dua kandidat kuat berdasarkan pola diperiksa. Pola tidak pernah menjadi
        alasan tunggal untuk menolak format baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingVerificationRequest"
      responses:
        "200":
          description: Hasil verifikasi, termasuk not_found atau courier_mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingVerificationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          description: Provider belum dapat menyelesaikan verifikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingVerificationResponse"

  /api/v1/integrations/tracking/subscriptions:
    post:
      tags: [Emisell Gateway]
      operationId: createTenantTrackingSubscription
      summary: Mendaftarkan AWB fulfillment untuk checkpoint tracking
      description: >
        Merchant berasal dari X-Emisell-Merchant-ID. Request idempotent berdasarkan
        merchant_id dan fulfillment_id. Worker memperbarui snapshot terjadwal;
        pembacaan snapshot tidak memakai hit provider.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingSubscriptionRequest"
      responses:
        "200":
          description: Subscription dan snapshot sudah tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSubscriptionResponse"
        "202":
          description: Subscription dibuat dan validasi AWB sedang antre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSubscriptionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"

  /api/v1/integrations/tracking/subscriptions/{fulfillment_id}:
    get:
      tags: [Emisell Gateway]
      operationId: getTenantTrackingSubscription
      summary: Membaca snapshot tracking fulfillment tanpa hit provider
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - name: fulfillment_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Snapshot tracking lokal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSubscriptionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Subscription tidak ditemukan pada merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Emisell Gateway]
      operationId: replaceTenantTrackingSubscription
      summary: Mengganti AWB fulfillment setelah verifikasi
      description: >
        AWB lama tetap aktif sampai AWB baru valid. expected_revision mencegah
        overwrite bersamaan; revisi lama disimpan sebagai audit dan webhook
        berikutnya membawa tracking_revision terbaru.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - name: fulfillment_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingSubscriptionReplacementRequest"
      responses:
        "200":
          description: AWB baru sudah diverifikasi dan menjadi revisi aktif
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Revision berubah atau shipment sudah final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: AWB tidak ditemukan atau salah ekspedisi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingVerificationResponse"
    delete:
      tags: [Emisell Gateway]
      operationId: removeTenantTrackingSubscription
      summary: Menghapus tracking fulfillment dari merchant
      description: >
        Menonaktifkan hubungan fulfillment milik merchant secara idempotent,
        membatalkan webhook yang belum terkirim, dan menghentikan polling bila
        tidak ada subscription aktif lain pada snapshot. Snapshot AWB tetap
        disimpan untuk audit dan dapat diaktifkan kembali melalui POST.
      security:
        - serviceBearerAuth: []
          merchantContextAuth: []
        - serviceKeyAuth: []
          merchantContextAuth: []
      parameters:
        - name: fulfillment_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Subscription merchant sudah dinonaktifkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingSubscriptionRemovalResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Subscription tidak pernah terdaftar pada merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/overview:
    get:
      tags: [Admin]
      operationId: adminOverview
      summary: Membaca metrik operasional
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Ringkasan dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/catalog:
    get:
      tags: [Admin]
      operationId: adminCatalog
      summary: Membaca kurir, layanan, dan rounding profile
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Katalog form admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminObjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/locations:
    get:
      tags: [Admin]
      operationId: adminSearchLocations
      summary: Mencari lokasi untuk form admin
      security:
        - adminBearerAuth: []
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Hasil pencarian lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/couriers:
    get:
      tags: [Admin]
      operationId: adminListCouriers
      summary: Membaca kurir untuk alat cek ongkir dan resi admin
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Daftar kurir dan layanan aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/calculate/domestic-cost:
    post:
      tags: [Admin]
      operationId: adminCalculateDomesticCost
      summary: Menjalankan cek ongkir dari dashboard admin
      description: >
        Menggunakan rate engine, snapshot, mapping lazy, dan provider resolver
        yang sama dengan endpoint customer.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateCostRequest"
      responses:
        "200":
          description: Tarif ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateCostResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Tarif atau mapping belum tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kuota provider habis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/track/waybill:
    post:
      tags: [Admin]
      operationId: adminTrackWaybill
      summary: Menjalankan cek resi dari dashboard admin
      description: >
        Membaca snapshot tracking atau mengantrikan refresh melalui durable
        worker yang sama dengan endpoint customer.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "200":
          description: Snapshot tracking tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "202":
          description: Refresh tracking sudah diantrikan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Tracking belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/tracking-operations:
    get:
      tags: [Admin]
      operationId: listAdminTrackingOperations
      summary: Monitor AWB, snapshot, dan antrean worker
      description: >-
        Endpoint internal staff yang menampilkan AWB penuh setelah didekripsi
        di memory API. Endpoint customer, webhook, audit, dan log tetap
        menggunakan AWB termasking.
      security:
        - adminBearerAuth: []
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: courier
          in: query
          schema: {type: string}
        - name: validation_status
          in: query
          schema: {type: string, enum: [unverified, valid, not_found, invalid]}
        - name: queue_status
          in: query
          schema: {type: string, enum: [pending, running, dead, final, idle]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Tabel operasional tracking beserta ringkasan antrean
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/tracking-operations/{id}:
    delete:
      tags: [Admin]
      operationId: deleteAdminTrackingOperation
      summary: Hapus permanen data operasional resi
      description: >-
        Menghapus shipment beserta job, status history, subscription, revision,
        dan webhook outbox terkait. Endpoint internal ini tersedia di semua
        environment, dilindungi admin API key, dan selalu mencatat audit admin.
      security:
        - adminBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "204":
          description: Data tracking dan seluruh turunannya berhasil dihapus
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/rate-snapshots:
    get:
      tags: [Admin]
      operationId: adminListRateSnapshots
      summary: Membaca snapshot tarif yang tersimpan otomatis dari provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar snapshot tarif provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/location-mappings:
    get:
      tags: [Admin]
      operationId: adminListLocationMappings
      summary: Membaca mapping lokasi provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: provider
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar mapping lokasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/provider-quotas:
    get:
      tags: [Admin]
      operationId: adminListProviderQuotas
      summary: Membaca ledger kuota tanpa mengekspos key
      security:
        - adminBearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        "200":
          description: Riwayat pemakaian kuota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminObjectResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/shipping-providers:
    get:
      tags: [Admin]
      operationId: adminListShippingProviders
      summary: Membaca master provider integrasi
      description: Mengembalikan metadata provider beserta jumlah credential, instalasi, dan merchant aktif.
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Master provider integrasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShippingProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      operationId: adminCreateShippingProvider
      summary: Menambahkan provider integrasi baru
      description: >
        Provider eksternal baru selalu dibuat requires_credential=true dan
        available=false sampai Partner Connector selesai disertifikasi.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminShippingProviderRequest"
      responses:
        "201":
          description: Provider berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShippingProviderResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Kode provider sudah digunakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/shipping-providers/{provider_code}:
    put:
      tags: [Admin]
      operationId: adminUpdateShippingProvider
      summary: Memperbarui metadata dan status provider
      description: >
        Kode, built_in, dan requires_credential tidak dapat diubah. Provider
        yang masih dipakai merchant tidak dapat dibuat unavailable.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminShippingProviderRequest"
      responses:
        "200":
          description: Provider berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShippingProviderResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Provider tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider masih digunakan merchant aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/shipping-providers/{provider_code}/partner-access-keys:
    get:
      tags: [Admin]
      operationId: adminListPartnerAccessKeys
      summary: Membaca access key Partner Portal milik provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
      responses:
        "200":
          description: Metadata key termasking tanpa plaintext secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerAccessKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Admin]
      operationId: adminCreatePartnerAccessKey
      summary: Membuat access key Partner Portal
      description: Plaintext secret hanya dikembalikan satu kali pada respons ini.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "201":
          description: Access key berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPartnerAccessKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/shipping-providers/{provider_code}/partner-access-keys/{id}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokePartnerAccessKey
      summary: Mencabut access key Partner Portal
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ShippingProviderCode"
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "200":
          description: Access key telah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerAccessKeyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/partner-submissions:
    get:
      tags: [Admin]
      operationId: adminListPartnerSubmissions
      summary: Membaca versi package integrasi partner
      description: >
        Console internal untuk submission, hasil validasi ZIP, dan lifecycle
        review connector. Artifact tidak pernah dieksekusi oleh API Kurir.
      security:
        - adminBearerAuth: []
      parameters:
        - name: provider_code
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PartnerSubmissionStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar submission terbaru
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/admin/partner-submissions/{id}:
    get:
      tags: [Admin]
      operationId: adminGetPartnerSubmission
      summary: Membaca detail satu submission partner
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Detail submission dan scan report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/partner-submissions/{id}/artifact:
    get:
      tags: [Admin]
      operationId: adminDownloadPartnerSubmissionArtifact
      summary: Mengunduh artefak ZIP karantina
      description: Hanya untuk staff dengan admin API key; response selalu no-store.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: File ZIP asli
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/partner-submissions/{id}/status:
    put:
      tags: [Admin]
      operationId: adminUpdatePartnerSubmissionStatus
      summary: Memindahkan lifecycle review package partner
      description: >
        Transisi divalidasi server-side. approved dan published hanya tersedia
        untuk scan yang lulus. Saat versi baru dipublikasikan, versi published
        sebelumnya otomatis menjadi superseded.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerSubmissionStatusRequest"
      responses:
        "200":
          description: Status dan catatan review tersimpan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Transisi lifecycle tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partner/v1/me:
    get:
      tags: [Partner Portal]
      operationId: partnerPortalMe
      summary: Membaca identitas provider dari partner access key
      description: Provider ditentukan oleh backend dan tidak diterima dari query atau body.
      security:
        - partnerBearerAuth: []
      responses:
        "200":
          description: Identitas provider terautentikasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerIdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /partner/v1/starter-package:
    get:
      tags: [Partner Portal]
      operationId: partnerDownloadStarterPackage
      summary: Mengunduh starter ZIP untuk provider terautentikasi
      description: >
        Membuat starter package secara dinamis. provider.code dan provider.name
        berasal dari partner access key sehingga template tidak dapat dibuat
        untuk provider lain.
      security:
        - partnerBearerAuth: []
      responses:
        "200":
          description: Starter package siap diedit developer
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /partner/v1/submissions:
    get:
      tags: [Partner Portal]
      operationId: partnerListOwnSubmissions
      summary: Membaca submission milik provider terautentikasi
      security:
        - partnerBearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PartnerSubmissionStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar submission hanya untuk provider pemilik key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Partner Portal]
      operationId: partnerUploadOwnSubmission
      summary: Mengunggah package untuk provider terautentikasi
      description: >
        Body sengaja tidak mempunyai provider_code. Backend selalu mengambil
        provider dari partner access key untuk mencegah cross-provider upload.
        Setiap access key dibatasi 10 percobaan per jam dan satu upload aktif.
        Setiap provider dibatasi 25 versi atau total artifact 500 MB.
      security:
        - partnerBearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [version, package]
              properties:
                version:
                  type: string
                  pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
                package:
                  type: string
                  format: binary
      responses:
        "201":
          description: Package tersimpan dan selesai static scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Versi sudah ada, upload masih berjalan, atau kuota provider tercapai
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Batas percobaan upload per access key tercapai
          headers:
            Retry-After:
              schema:
                type: integer
                example: 3600
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partner/v1/submissions/{id}:
    get:
      tags: [Partner Portal]
      operationId: partnerGetOwnSubmission
      summary: Membaca detail submission milik provider terautentikasi
      security:
        - partnerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Detail submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSubmissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /partner/v1/submissions/{id}/artifact:
    get:
      tags: [Partner Portal]
      operationId: partnerDownloadOwnArtifact
      summary: Mengunduh package milik provider terautentikasi
      security:
        - partnerBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: File ZIP asli dengan Cache-Control private, no-store
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/admin/provider-credentials:
    get:
      tags: [Admin]
      operationId: adminListProviderCredentials
      summary: Membaca credential provider tanpa secret
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Daftar metadata credential provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      operationId: adminAddProviderCredential
      summary: Memvalidasi dan menyimpan API key provider
      description: >
        Key divalidasi ke provider, dienkripsi AES-256-GCM, dan langsung
        tersedia untuk resolver runtime tanpa restart API. Key platform yang
        pernah dinonaktifkan akan diaktifkan kembali pada record yang sama.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderCredentialRequest"
      responses:
        "201":
          description: Credential valid dan aktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Credential terikat pada scope merchant lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Key ditolak oleh provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/provider-credentials/{id}/disable:
    post:
      tags: [Admin]
      operationId: adminDisableProviderCredential
      summary: Menonaktifkan credential provider
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "204":
          description: Credential dinonaktifkan
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Credential tidak ditemukan atau sudah nonaktif
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/api-keys:
    get:
      tags: [Admin]
      operationId: adminListCustomerAPIKeys
      summary: Membaca metadata customer API key
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Daftar key tanpa secret dan hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerAPIKeyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      operationId: adminGenerateAPIKey
      summary: Membuat Public API atau Main Service key
      description: >
        Secret lengkap hanya dikembalikan pada response pembuatan ini.
        Database hanya menyimpan hash SHA-256. Key dibuat tanpa nama,
        tidak kedaluwarsa, dan aktif sampai di-revoke. Hanya kind main_service
        yang memperoleh scope gateway:access.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: Key berhasil dibuat; secret wajib disimpan sekarang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCustomerAPIKeyResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/api-keys/{id}/revoke:
    post:
      tags: [Admin]
      operationId: adminRevokeCustomerAPIKey
      summary: Mencabut akses satu customer API key
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "204":
          description: Key berhasil dicabut
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Key tidak ditemukan atau sudah dicabut
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/tracking-webhook:
    get:
      tags: [Admin]
      operationId: adminGetTrackingWebhookSettings
      summary: Membaca konfigurasi webhook tracking Emisell
      description: Secret hanya dikembalikan dalam bentuk mask.
      security:
        - adminBearerAuth: []
      responses:
        "200":
          description: Konfigurasi efektif dari database atau fallback environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingWebhookSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Admin]
      operationId: adminUpdateTrackingWebhookSettings
      summary: Menyimpan URL dan status aktif webhook
      description: Production hanya menerima URL HTTPS publik.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTrackingWebhookSettingsRequest"
      responses:
        "200":
          description: Konfigurasi tersimpan dan langsung dibaca worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingWebhookSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Secret belum dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: URL webhook tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/admin/tracking-webhook/secret:
    post:
      tags: [Admin]
      operationId: adminGenerateTrackingWebhookSecret
      summary: Generate atau rotate webhook secret
      description: Plaintext secret 256-bit hanya tersedia pada response ini.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "201":
          description: Secret baru dibuat dan tersimpan terenkripsi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedTrackingWebhookSecretResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/admin/tracking-webhook/test:
    post:
      tags: [Admin]
      operationId: adminTestTrackingWebhook
      summary: Mengirim event test tanpa data pelanggan
      description: Event tracking.test ditandatangani dengan HMAC yang sama seperti event production.
      security:
        - adminBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AdminActor"
      responses:
        "200":
          description: Hasil percobaan delivery webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingWebhookTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: URL atau secret belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    rajaOngkirKeyAuth:
      type: apiKey
      in: header
      name: key
      description: Alternatif pengiriman customer API key; tidak mengubah kontrak path
    serviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Dedicated Emisell service API key
      description: >
        Key Main Service hasil generate dashboard dengan scope gateway:access,
        atau secret statis API_KEYS sebagai recovery.
    serviceKeyAuth:
      type: apiKey
      in: header
      name: key
      description: >
        Key Main Service hasil generate dashboard dengan scope gateway:access,
        atau secret statis API_KEYS sebagai recovery. Hanya disimpan pada backend Emisell.
    merchantContextAuth:
      type: apiKey
      in: header
      name: X-Emisell-Merchant-ID
      description: >
        Merchant ID stabil yang ditentukan backend Emisell. Wajib untuk semua
        endpoint /api/v1/integrations dan tidak diterima dari browser.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Admin API key
    partnerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Emisell partner access key
      description: Access key berformat epk_live_* yang terikat ke satu provider.

  parameters:
    ShippingProviderCode:
      name: provider_code
      in: path
      required: true
      description: Kode provider extension pada katalog, misalnya emisell atau rajaongkir.
      schema:
        type: string
        pattern: "^[a-z0-9_-]{2,48}$"
    MerchantIDHeader:
      name: X-Emisell-Merchant-ID
      in: header
      required: false
      description: >
        Merchant ID stabil dari backend Emisell. Wajib pada endpoint gateway;
        opsional pada endpoint kompatibilitas RajaOngkir V2 agar snapshot dan
        credential tetap terisolasi per merchant. Hanya diterima bersama
        key bertipe main_service dengan scope gateway:access, atau recovery key
        statis dari API_KEYS. Key public biasa ditolak.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
    Search:
      name: search
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProvinceID:
      name: province_id
      in: path
      required: true
      description: >
        ID provinsi dari endpoint daftar provinsi. Pada /api/v1 nilainya adalah
        ID dump RajaOngkir; pada /v1 nilainya public ID canonical.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 5
    CityID:
      name: city_id
      in: path
      required: true
      description: >
        ID kota/kabupaten dari endpoint daftar kota dengan namespace sesuai
        base path API.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 55
    DistrictID:
      name: district_id
      in: path
      required: true
      description: >
        ID kecamatan dari endpoint daftar kecamatan dengan namespace sesuai
        base path API.
      schema:
        oneOf:
          - type: integer
            format: int64
          - type: string
      example: 442
    LegacyRegionID:
      name: id
      in: path
      required: true
      description: ID numerik dari dump region-service RajaOngkir.
      schema:
        type: integer
      example: 55
    AdminActor:
      name: X-Admin-Actor
      in: header
      schema:
        type: string
        maxLength: 64

  responses:
    InvalidRequest:
      description: Payload atau parameter tidak valid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"
    Unauthorized:
      description: API key tidak valid
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RajaOngkirUnsupportedMediaType:
      description: Kalkulasi RajaOngkir V2 hanya menerima form-urlencoded atau multipart form
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RajaOngkirErrorResponse"
    ProviderError:
      description: Provider belum tersedia, timeout, atau kuotanya habis
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LegacyRegionNotFound:
      description: ID wilayah lama tidak ditemukan
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyRegionErrorResponse"
    LegacyInvalidRequest:
      description: Parameter kompatibilitas lama tidak valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LegacyRegionErrorResponse"
    LegacyProviderError:
      description: Tarif belum tersedia atau provider gagal merespons
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/LegacyRegionErrorResponse"
              - $ref: "#/components/schemas/RajaOngkirErrorResponse"

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ready]

    LegacyRegion:
      type: object
      required: [id, name]
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        name:
          type: string
        zipCode:
          type: string
        provinceId:
          oneOf:
            - type: integer
            - type: string
        provinceName:
          type: string
        cityId:
          oneOf:
            - type: integer
            - type: string
        cityName:
          type: string
        districtId:
          oneOf:
            - type: integer
            - type: string

    LegacyRegionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LegacyRegion"

    LegacyRegionDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LegacyRegion"

    LegacyRegionErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LegacyShippingCost:
      type: object
      required: [name, code, service, description, cost, etd, serviceName]
      properties:
        name:
          type: string
        code:
          type: string
        service:
          type: string
        description:
          type: string
        cost:
          type: integer
          minimum: 0
        etd:
          type: string
        serviceName:
          type: string
          enum: [REG, EXPRESS, SAMEDAY, ECONOMY, TRUCKING, CARGO, MOTOR, OTHER]

    LegacyShippingCostResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status]
          properties:
            message:
              type: string
            code:
              type: integer
            status:
              type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/LegacyShippingCost"

    Location:
      type: object
      required:
        - id
        - label
        - province_id
        - city_id
        - district_id
        - subdistrict_id
        - province_name
        - city_name
        - district_name
        - subdistrict_name
        - zip_code
      properties:
        id:
          type: string
          description: ID lokasi akhir yang dipakai sebagai origin atau destination
        label:
          type: string
        province_id:
          type: string
        city_id:
          type: string
        district_id:
          type: string
        subdistrict_id:
          type: string
        province_name:
          type: string
        city_name:
          type: string
        district_name:
          type: string
        subdistrict_name:
          type: string
        zip_code:
          type: string
          pattern: "^[0-9]{5}$"
        province:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk province_name
        city:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk city_name
        district:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk district_name
        subdistrict:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk subdistrict_name
        postal_code:
          type: string
          deprecated: true
          description: Alias kompatibilitas lama untuk zip_code
          pattern: "^[0-9]{5}$"
        postal_codes:
          type: array
          description: Semua kode pos aktif yang terhubung dengan lokasi
          items:
            type: string
            pattern: "^[0-9]{5}$"

    LocationSearchResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status, request_id]
          properties:
            message:
              type: string
              examples: [Success Get Domestic Destinations]
            code:
              type: integer
              examples: [200]
            status:
              type: string
              examples: [success]
            request_id:
              type: string
            next_cursor:
              type: [string, "null"]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    HierarchyLocation:
      type: object
      required: [id, name]
      properties:
        id:
          oneOf:
            - type: integer
              format: int64
            - type: string
          description: >
            ID unik pada level dan base path ini. Jangan menafsirkan angka pada
            /api/v1 sebagai kode Kemendagri.
        name:
          type: string
        zip_code:
          type: string
          description: Kode pos utama jika tersedia

    LocationHierarchyResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          type: object
          required: [message, code, status]
          properties:
            message:
              type: string
            code:
              type: integer
              examples: [200]
            status:
              type: string
              examples: [success]
            request_id:
              type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/HierarchyLocation"

    CourierService:
      type: object
      required: [code, name, group, service_type, calculation_mode]
      properties:
        code:
          type: string
        name:
          type: string
        group:
          type: string
          enum:
            - economy
            - regular
            - next_day
            - express
            - same_day
            - instant
            - cargo
            - international
            - special
            - unknown
        service_type:
          type: string
          enum: [parcel, cargo, same_day, instant, international]
        calculation_mode:
          type: string
          enum: [local_rate_card, provider_quote]

    Courier:
      type: object
      required:
        - code
        - name
        - logo
        - provider_code
        - rate_provider_code
        - tracking_provider_code
        - supports_domestic_cost
        - supports_international_cost
        - supports_tracking
        - catalog_source
        - tracking_catalog_source
        - catalog_verified_at
        - services
      properties:
        code:
          type: string
        name:
          type: string
        logo:
          type: string
          format: uri
          pattern: "^https://"
          description: URL HTTPS permanen logo ekspedisi yang di-host API Kurir.
          examples: ["https://api-kurir.emisell.com/courier-logos/jne.webp"]
        provider_code:
          type: string
          description: Provider utama yang memasok capability kurir ke katalog.
        rate_provider_code:
          type: string
          description: Provider cek ongkir; kosong untuk kurir tracking-only.
        tracking_provider_code:
          type: string
          description: Provider cek resi; kosong bila tracking belum tersedia.
        supports_domestic_cost:
          type: boolean
        supports_international_cost:
          type: boolean
        supports_tracking:
          type: boolean
        catalog_source:
          type: string
        tracking_catalog_source:
          type: string
        catalog_verified_at:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: "#/components/schemas/CourierService"

    CourierListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Courier"

    TenantShippingServiceSelection:
      type: object
      additionalProperties: false
      required: [courier_code, service_code]
      properties:
        courier_code:
          type: string
          pattern: "^[a-z0-9_-]{2,32}$"
          examples: [jne]
        service_code:
          type: string
          minLength: 1
          maxLength: 64
          examples: [REG]

    TenantShippingProvider:
      type: object
      required:
        - code
        - name
        - logo
        - description
        - built_in
        - integration_type
        - distribution_type
        - requires_credential
        - available
        - installed
        - active
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_-]{2,48}$"
        name:
          type: string
        logo:
          type: string
          format: uri
          pattern: "^https://"
          description: URL HTTPS permanen untuk logo provider yang dapat langsung dirender oleh Emisell.
          examples: ["https://api-kurir.emisell.com/provider-logos/emisell.svg"]
        description:
          type: string
          minLength: 10
          maxLength: 500
          description: Ringkasan provider untuk listing extension pengiriman.
        built_in:
          type: boolean
        integration_type:
          type: string
          enum: [built_in, managed_upstream, partner_hosted]
          description: Menentukan apakah provider bawaan, memakai adapter API Kurir, atau memakai release partner.
        distribution_type:
          type: string
          enum: [built_in, public, limited, private]
          description: Mengontrol cakupan merchant yang dapat menemukan provider.
        requires_credential:
          type: boolean
        available:
          type: boolean
          const: true
          description: Katalog merchant hanya berisi provider yang tersedia. Status false hanya terlihat melalui API admin.
        installed:
          type: boolean
          description: Provider bawaan selalu true; eksternal true jika mempunyai credential valid.
        active:
          type: boolean
        active_release_version:
          type: string
          description: Versi package production untuk provider partner-hosted; kosong untuk provider lain.
        required_scopes:
          type: array
          items:
            type: string
        granted_scopes:
          type: array
          items:
            type: string
          description: Scope yang dipin saat merchant mengaktifkan release ini.

    TenantShippingProviderCatalog:
      type: object
      required: [active_provider_code, version, providers]
      properties:
        active_provider_code:
          type: [string, "null"]
          description: Null berarti seller belum mengaktifkan provider pengiriman.
          examples: [null, emisell]
        version:
          type: integer
          minimum: 0
          description: Nol berarti tenant belum pernah mengubah pilihan provider.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/TenantShippingProvider"

    TenantShippingProviderCatalogResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TenantShippingProviderCatalog"

    TenantShippingProviderChangeRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 0
          description: Version dari GET providers untuk optimistic concurrency.

    TenantShippingPreference:
      type: object
      required:
        - provider_code
        - configured
        - mode
        - enabled_groups
        - services
        - version
        - updated_at
      properties:
        provider_code:
          type: string
          description: Provider aktif yang memiliki preference ini; kosong hanya ketika shipping nonaktif.
        configured:
          type: boolean
          description: False hanya bila merchant belum pernah menyimpan preference.
        mode:
          type: string
          enum: [custom]
        enabled_groups:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - regular
              - next_day
              - economy
              - cargo
        services:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantShippingServiceSelection"
        version:
          type: integer
          minimum: 0
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    TenantShippingPreferenceUpdateRequest:
      type: object
      additionalProperties: false
      required: [services]
      properties:
        mode:
          type: string
          enum: [custom]
          default: custom
          description: Opsional untuk kompatibilitas; nilai efektif selalu custom.
        enabled_groups:
          type: array
          maxItems: 0
          uniqueItems: true
          deprecated: true
          description: Harus kosong. Gunakan services untuk seluruh pilihan.
          items:
            type: string
        services:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TenantShippingServiceSelection"

    TenantShippingGroup:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          enum: [regular, next_day, economy, cargo]
        name:
          type: string

    TenantShippingCatalogService:
      description: Layanan checkout Emisell; group selalu regular, next_day, economy, atau cargo.
      allOf:
        - $ref: "#/components/schemas/CourierService"
        - type: object
          required: [selected, selectable]
          properties:
            group:
              type: string
              enum: [regular, next_day, economy, cargo]
            selected:
              type: boolean
            selectable:
              type: boolean
              description: False bila pilihan baru akan melampaui limit merchant.

    TenantShippingCatalogCourier:
      type: object
      required:
        - code
        - name
        - logo
        - provider_code
        - rate_provider_code
        - tracking_provider_code
        - supports_domestic_cost
        - supports_international_cost
        - supports_tracking
        - selection_state
        - selectable
        - selected_service_count
        - total_service_count
        - services
      properties:
        code:
          type: string
        name:
          type: string
        logo:
          type: string
          format: uri
          pattern: "^https://"
          description: Logo ekspedisi untuk dirender pada pengaturan shipping Emisell.
        provider_code:
          type: string
        rate_provider_code:
          type: string
        tracking_provider_code:
          type: string
        supports_domestic_cost:
          type: boolean
        supports_international_cost:
          type: boolean
        supports_tracking:
          type: boolean
        selection_state:
          type: string
          enum: [none, partial, all]
        selectable:
          type: boolean
          description: >
            False bila kurir belum dipilih dan penambahan kurir akan melampaui
            limit. Kurir yang sudah dipilih tetap selectable agar dapat diedit.
        selected_service_count:
          type: integer
          minimum: 0
        total_service_count:
          type: integer
          minimum: 0
        services:
          type: array
          items:
            $ref: "#/components/schemas/TenantShippingCatalogService"

    TenantShippingLimitUsage:
      type: object
      required: [maximum, selected, remaining, available]
      properties:
        maximum:
          type: integer
          minimum: 1
        selected:
          type: integer
          minimum: 0
        remaining:
          type: integer
          minimum: 0
        available:
          type: integer
          minimum: 0

    TenantShippingSelectionLimits:
      type: object
      required: [enforced, couriers, services]
      properties:
        enforced:
          type: boolean
          enum: [true]
          description: Limit selalu diberlakukan untuk semua merchant.
        couriers:
          $ref: "#/components/schemas/TenantShippingLimitUsage"
        services:
          $ref: "#/components/schemas/TenantShippingLimitUsage"

    TenantShippingCatalogResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          type: object
          required: [provider_code, preference, limits, groups, couriers]
          properties:
            provider_code:
              type: string
              description: Provider aktif yang menjadi sumber katalog layanan; kosong ketika shipping nonaktif.
            preference:
              $ref: "#/components/schemas/TenantShippingPreference"
            limits:
              $ref: "#/components/schemas/TenantShippingSelectionLimits"
            groups:
              type: array
              items:
                $ref: "#/components/schemas/TenantShippingGroup"
            couriers:
              type: array
              items:
                $ref: "#/components/schemas/TenantShippingCatalogCourier"

    TenantShippingPreferenceResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TenantShippingPreference"

    CalculateCostRequest:
      type: object
      additionalProperties: false
      required: [origin, destination, weight, courier]
      properties:
        origin:
          type: string
        destination:
          type: string
        weight:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Berat final/chargeable yang sudah dihitung Emisell dalam gram
        courier:
          type: string
          pattern: "^[a-zA-Z0-9_-]+(:[a-zA-Z0-9_-]+)*$"
        dimensions:
          $ref: "#/components/schemas/Dimensions"
        item_value:
          type: integer
          minimum: 0
        options:
          $ref: "#/components/schemas/CalculateOptions"

    RajaOngkirCalculateCostRequest:
      type: object
      required: [origin, destination, weight]
      properties:
        origin:
          type: integer
          format: int64
          description: ID RajaOngkir lokal sesuai level endpoint calculate
          examples: [4911]
        destination:
          type: integer
          format: int64
          description: ID RajaOngkir lokal sesuai level endpoint calculate
          examples: [25976]
        weight:
          type: integer
          format: int64
          minimum: 1
        courier:
          type: string
          pattern: "^[a-z0-9_-]+(:[a-z0-9_-]+)*$"
          description: >
            Wajib untuk public API tanpa Merchant ID. Tidak diperlukan dan
            diabaikan pada Emisell Gateway karena kurir berasal dari konfigurasi
            service merchant.
        price:
          type: string
          enum: [lowest, highest]
          description: >
            Mengurutkan seluruh opsi layanan. lowest mengurutkan biaya naik dan
            highest mengurutkan biaya turun; parameter ini tidak membatasi hasil
            menjadi satu layanan.
        include_group:
          type: boolean
          default: false
          description: >
            Extension API Kurir. Jika true, setiap hasil juga memuat
            canonical_service, service_group, dan service_type. Jika false atau
            tidak dikirim, respons tetap 1:1 dengan RajaOngkir V2.

    Dimensions:
      type: object
      description: >
        Field kompatibilitas opsional. Eligibility minimum/maksimum layanan
        memakai field weight final dari Emisell.
      additionalProperties: false
      required: [length, width, height, unit]
      properties:
        length:
          type: integer
          minimum: 1
          maximum: 10000
        width:
          type: integer
          minimum: 1
          maximum: 10000
        height:
          type: integer
          minimum: 1
          maximum: 10000
        unit:
          type: string
          const: cm

    CalculateOptions:
      type: object
      additionalProperties: false
      properties:
        include_insurance:
          type: boolean
          default: false
        include_unverified:
          type: boolean
          default: false

    CalculateCostResponse:
      type: object
      required: [meta, data, warnings]
      properties:
        meta:
          type: object
          required: [request_id, calculated_at, currency]
          properties:
            request_id:
              type: string
            calculated_at:
              type: string
              format: date-time
            currency:
              type: string
              const: IDR
        data:
          type: array
          items:
            $ref: "#/components/schemas/RateResult"
        warnings:
          type: array
          items:
            type: string

    RajaOngkirCalculateCostResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: array
          items:
            type: object
            required: [name, code, logo, service, description, cost, etd]
            properties:
              name:
                type: string
              code:
                type: string
              logo:
                type: string
                format: uri
                description: URL logo dari master ekspedisi API Kurir
              service:
                type: string
                description: Kode layanan mentah dari provider
              canonical_service:
                type: string
                description: Kode layanan yang dinormalisasi untuk pengelompokan
              service_group:
                type: string
                description: Grup layanan seperti regular, cargo, next_day, instant, atau same_day
              service_type:
                type: string
                description: Tipe operasional layanan seperti parcel atau cargo
              description:
                type: string
              cost:
                type: integer
                format: int64
              etd:
                type: string

    RajaOngkirMeta:
      type: object
      required: [message, code, status]
      properties:
        message:
          type: string
        code:
          type: integer
        status:
          type: string
          enum: [success, error, failed]

    RajaOngkirDestinationSearchResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: array
          items:
            type: object
            required:
              - id
              - label
              - province_name
              - city_name
              - district_name
              - subdistrict_name
              - zip_code
            properties:
              id:
                type: integer
                format: int64
              label:
                type: string
              province_name:
                type: string
              city_name:
                type: string
              district_name:
                type: string
              subdistrict_name:
                type: string
              zip_code:
                type: string

    RajaOngkirErrorResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RajaOngkirMeta"
        data:
          type: "null"

    RateResult:
      type: object
      required: [courier, service, cost, etd, weight, breakdown, source, eligibility]
      properties:
        courier:
          type: object
          required: [code, name, logo]
          properties:
            code:
              type: string
            name:
              type: string
            logo:
              type: string
              format: uri
              description: URL logo dari master ekspedisi API Kurir
        service:
          type: object
          required:
            - code
            - name
            - canonical_code
            - group
            - type
            - variant_code
          properties:
            code:
              type: string
            name:
              type: string
            canonical_code:
              type: string
              description: Kode service stabil milik API Kurir
            group:
              type: string
              enum:
                - economy
                - regular
                - next_day
                - express
                - same_day
                - instant
                - cargo
                - international
                - special
                - unknown
            type:
              type: string
              enum:
                - parcel
                - cargo
                - same_day
                - instant
                - international
                - unknown
            variant_code:
              type: string
              description: Kode mentah jika merupakan varian canonical
        cost:
          type: integer
          minimum: 0
        etd:
          type: object
          required: [text]
          properties:
            min_days:
              type: [integer, "null"]
            max_days:
              type: [integer, "null"]
            text:
              type: string
        weight:
          $ref: "#/components/schemas/WeightBreakdown"
        breakdown:
          $ref: "#/components/schemas/CostBreakdown"
        source:
          $ref: "#/components/schemas/RateSource"
        eligibility:
          oneOf:
            - $ref: "#/components/schemas/ServiceWeightEligibility"
            - type: "null"

    WeightBreakdown:
      type: object
      required:
        - actual_grams
        - volumetric_grams
        - chargeable_grams
        - rounded_grams
        - billing_grams
        - minimum_grams
        - minimum_accepted_grams
        - minimum_billable_grams
        - maximum_accepted_grams
        - rounding_profile
      properties:
        actual_grams:
          type: integer
        volumetric_grams:
          type: integer
        chargeable_grams:
          type: integer
        rounded_grams:
          type: integer
        billing_grams:
          type: integer
        minimum_grams:
          type: integer
        minimum_accepted_grams:
          type: integer
        minimum_billable_grams:
          type: integer
        maximum_accepted_grams:
          type: [integer, "null"]
        rounding_profile:
          type: string

    ServiceWeightEligibility:
