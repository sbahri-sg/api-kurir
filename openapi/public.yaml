          type: string
          description: Bentuk termasking; bukan secret yang dapat dipakai.
        scopes:
          type: array
          items:
            type: string
            enum: ["shipping:read", "tracking:read", "gateway:access"]
        kind:
          type: string
          enum: [public, main_service]
          description: >
            public tidak boleh membawa konteks merchant; main_service boleh
            mengakses Emisell Gateway dari backend tepercaya.
        active:
          type: boolean
        last_used_at:
          type: [string, "null"]
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_by:
          type: [string, "null"]
        revoked_at:
          type: [string, "null"]
          format: date-time

    ProviderCredential:
      type: object
      required:
        - id
        - provider_code
        - credential_alias
        - display_key
        - daily_limit
        - active
        - validation_status
        - last_validated_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          description: Kosong untuk credential platform; terisi untuk BYOK seller.
        provider_code:
          type: string
          enum: [rajaongkir, biteship]
          description: Biteship hanya digunakan sebagai fallback internal tarif dan tracking Emisell Kurir.
        credential_alias:
          type: string
        display_key:
          type: string
          description: Bentuk termasking; secret asli tidak dikembalikan.
        daily_limit:
          type: integer
        active:
          type: boolean
        validation_status:
          type: string
          enum: [valid, invalid]
        last_validated_at:
          type: string
          format: date-time
        last_selected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    TenantProviderCredential:
      type: object
      required:
        - provider_code
        - credential_alias
        - display_key
        - daily_limit
        - active
        - validation_status
        - last_validated_at
        - created_at
      properties:
        provider_code:
          type: string
          enum: [rajaongkir]
        credential_alias:
          type: string
        display_key:
          type: string
          description: Bentuk termasking; secret asli tidak dikembalikan.
        daily_limit:
          type: integer
        active:
          type: boolean
        validation_status:
          type: string
          enum: [valid, invalid]
        last_validated_at:
          type: string
          format: date-time
        last_selected_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    CreateTenantProviderCredentialRequest:
      type: object
      additionalProperties: false
      required: [provider_code, api_key]
      properties:
        provider_code:
          type: string
          enum: [rajaongkir]
        api_key:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true
        daily_limit:
          type: integer
          minimum: 1
          maximum: 100000000
          default: 50000

    TenantProviderCredentialResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TenantProviderCredential"

    TenantProviderCredentialListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantProviderCredential"

    CreateProviderCredentialRequest:
      type: object
      additionalProperties: false
      required: [provider_code, api_key]
      properties:
        provider_code:
          type: string
          enum: [rajaongkir, biteship]
          description: Biteship hanya digunakan sebagai fallback internal tarif dan tracking Emisell Kurir.
        api_key:
          type: string
          minLength: 8
          maxLength: 512
          writeOnly: true
        daily_limit:
          type: integer
          minimum: 1
          maximum: 100000000
          default: 50000
          description: Batas paket provider seller untuk ledger lokal.

    ProviderCredentialResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/ProviderCredential"

    ProviderCredentialListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProviderCredential"

    CustomerAPIKeyListResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          allOf:
            - $ref: "#/components/schemas/RequestMeta"
            - type: object
              properties:
                limit:
