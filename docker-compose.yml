name: api-kurir

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: api_kurir
      POSTGRES_USER: api_kurir
      POSTGRES_PASSWORD: api_kurir
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - api-kurir-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_kurir -d api_kurir"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP: migrate
    environment:
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  region-import:
    profiles: ["bootstrap"]
    build:
      context: .
      args:
        APP: region-import
    environment:
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  legacy-region-import:
    profiles: ["bootstrap"]
    build:
      context: .
      args:
        APP: legacy-region-import
    environment:
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      LEGACY_REGION_DB_PATH: /data/regions.db
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      args:
        APP: api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: "${APP_ENV:-development}"
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      REDIS_ADDR: "${COMPOSE_REDIS_ADDR:-redis:6379}"
      RAJAONGKIR_HOSTED_BASE_URL: http://rajaongkir-hosted:8080/partner/v1
      RAJAONGKIR_HOSTED_PUBLIC_BASE_URL: "${RAJAONGKIR_HOSTED_PUBLIC_BASE_URL:-http://127.0.0.1:${DASHBOARD_PORT:-5173}/connectors/rajaongkir/v1}"
    ports:
      - "${HTTP_BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rajaongkir-hosted:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        APP: worker
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      REDIS_ADDR: "${COMPOSE_REDIS_ADDR:-redis:6379}"
      RAJAONGKIR_HOSTED_BASE_URL: http://rajaongkir-hosted:8080/partner/v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      rajaongkir-hosted:
        condition: service_healthy

  rajaongkir-hosted:
    build:
      context: ./artifacts/rajaongkir-hosted-v1.0.6
    environment:
      PORT: "8080"
      RAJAONGKIR_DELIVERY_ENV: "${RAJAONGKIR_DELIVERY_ENV:-production}"
      UPSTREAM_TIMEOUT_MS: "${RAJAONGKIR_HOSTED_TIMEOUT_MS:-8000}"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/partner/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    ports:
      - "${DASHBOARD_BIND_ADDR:-0.0.0.0}:${DASHBOARD_PORT:-5173}:80"
    depends_on:
      - api
      - rajaongkir-hosted

  location-sync:
    profiles: ["legacy-provider-full-sync"]
    build:
      context: .
      args:
        APP: location-sync
    env_file:
      - path: .env
        required: false
    command:
      - -mode
      - full
      - -max-hits
      - "${LOCATION_SYNC_MAX_HITS:-9000}"
      - -concurrency
      - "${LOCATION_SYNC_CONCURRENCY:-4}"
      - -request-interval
      - "${LOCATION_SYNC_REQUEST_INTERVAL:-250ms}"
      - -continuous
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - api-kurir-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  api-kurir-postgres:
  api-kurir-redis:
