          type: string
          description: Secret sekali tampil dengan prefix ek_live_.
          pattern: "^ek_live_[A-Za-z0-9_-]{43}$"

    CreateAPIKeyRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [public, main_service]
          default: public
          description: Gunakan main_service untuk backend Emisell Gateway.

    GeneratedCustomerAPIKeyResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/GeneratedCustomerAPIKey"

    TrackingWebhookSettings:
      type: object
      required:
        - configured
        - callback_url
        - enabled
        - secret_configured
        - secret_hint
        - source
        - last_test_error
      properties:
        configured:
          type: boolean
        callback_url:
          type: string
          description: Kosong hanya ketika konfigurasi belum dilengkapi.
        enabled:
          type: boolean
        secret_configured:
          type: boolean
        secret_hint:
          type: string
          description: Mask aman; bukan secret yang dapat dipakai.
        source:
          type: string
          enum: [database, environment]
        last_test_at:
          type: [string, "null"]
          format: date-time
        last_test_success:
          type: [boolean, "null"]
        last_test_http_status:
          type: [integer, "null"]
        last_test_error:
          type: string
        updated_by:
          type: string
        updated_at:
          type: [string, "null"]
          format: date-time

    UpdateTrackingWebhookSettingsRequest:
      type: object
      additionalProperties: false
      required: [callback_url, enabled]
      properties:
        callback_url:
          type: string
          description: Wajib terisi ketika enabled bernilai true.
        enabled:
          type: boolean

    TrackingWebhookSettingsResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TrackingWebhookSettings"

    GeneratedTrackingWebhookSecret:
      type: object
      required: [settings, secret]
      properties:
        settings:
          $ref: "#/components/schemas/TrackingWebhookSettings"
        secret:
          type: string
          writeOnly: true
          pattern: "^whsec_[A-Za-z0-9_-]{43}$"
          description: Plaintext secret hanya tampil pada response generate/rotate.

    GeneratedTrackingWebhookSecretResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/GeneratedTrackingWebhookSecret"

    TrackingWebhookTestResult:
      type: object
      required: [success, http_status, event_id, tested_at, message]
      properties:
        success:
          type: boolean
        http_status:
          type: integer
        event_id:
          type: string
        tested_at:
          type: string
          format: date-time
        message:
          type: string

    TrackingWebhookTestResponse:
      type: object
      required: [meta, data]
      properties:
        meta:
          $ref: "#/components/schemas/RequestMeta"
        data:
          $ref: "#/components/schemas/TrackingWebhookTestResult"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: [object, "null"]
              additionalProperties: true
