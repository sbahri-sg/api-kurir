name: api-kurir

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: api_kurir
      POSTGRES_USER: api_kurir
      POSTGRES_PASSWORD: api_kurir
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - api-kurir-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_kurir -d api_kurir"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      args:
        APP: migrate
    environment:
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        APP: api
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: "${APP_ENV:-development}"
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      REDIS_ADDR: "${COMPOSE_REDIS_ADDR:-redis:6379}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        APP: worker
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      REDIS_ADDR: "${COMPOSE_REDIS_ADDR:-redis:6379}"
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      - api

  location-sync:
    profiles: ["legacy-provider-full-sync"]
    build:
      context: .
      args:
        APP: location-sync
    env_file:
      - path: .env
        required: false
    command:
      - -mode
      - full
      - -max-hits
      - "${LOCATION_SYNC_MAX_HITS:-9000}"
      - -concurrency
      - "${LOCATION_SYNC_CONCURRENCY:-4}"
      - -request-interval
      - "${LOCATION_SYNC_REQUEST_INTERVAL:-250ms}"
      - -continuous
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: postgres://api_kurir:api_kurir@postgres:5432/api_kurir?sslmode=disable
      REDIS_ENABLED: "false"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - api-kurir-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  api-kurir-postgres:
  api-kurir-redis:
